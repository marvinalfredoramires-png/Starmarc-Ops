<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARMARC CLOUD OPS - ADMIN REAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#06060a] text-white p-6 font-mono">
<h1 class="text-2xl font-bold mb-6">STARMARC CLOUD OPS - DATOS REALES</h1>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
  <div class="bg-zinc-900 p-4 rounded-xl border border-purple-500/30">
    <p class="text-xs opacity-60">Total Users</p>
    <p id="total-users" class="text-2xl font-bold">...</p>
  </div>
  <div class="bg-zinc-900 p-4 rounded-xl border border-purple-500/30">
    <p class="text-xs opacity-60">Total Files</p>
    <p id="total-files" class="text-2xl font-bold">...</p>
  </div>
  <div class="bg-zinc-900 p-4 rounded-xl border border-purple-500/30">
    <p class="text-xs opacity-60">Status</p>
    <p class="text-green-400 font-bold">Operational</p>
  </div>
  <div class="bg-zinc-900 p-4 rounded-xl border border-purple-500/30">
    <p class="text-xs opacity-60">Storage</p>
    <p id="storage-used" class="text-sm">Conectando...</p>
  </div>
</div>

<div id="user-list" class="bg-zinc-900 p-4 rounded-xl">Cargando usuarios reales...</div>

<script>
  // CONFIGURA AQUI
  const SUPABASE_URL = 'https://cdffffghheikcmstcmcl.supabase.co';
  const SUPABASE_ANON_KEY = 'PEGA_AQUI_TU_ANON_KEY_COMPLETA_eyJhbGc...';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function cargar() {
    // Usuarios
    const { count: users } = await supabaseClient.from('profiles').select('*', {count:'exact', head:true});
    if(users !== null) document.getElementById('total-users').innerText = users;

    // Archivos
    const { count: files } = await supabaseClient.from('archivos').select('*', {count:'exact', head:true});
    if(files !== null) document.getElementById('total-files').innerText = files;

    // Lista real de usuarios
    const { data } = await supabaseClient.from('profiles').select('full_name, email').limit(10);
    if(data){
      document.getElementById('user-list').innerHTML = '<h3 class="font-bold mb-2">User Folders Reales</h3>' + data.map(u=> `<div class="py-2 border-b border-zinc-800">${u.full_name || u.email}</div>`).join('');
    }
  }
  cargar();
</script>
</body>
</html>
