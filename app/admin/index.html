const sb = supabase.createClient(url, key);

async function cargar(){
 const {count:cu} = await sb.from('profiles').select('*',{count:'exact',head:true});

 document.getElementById('u').innerText = cu ?? 0;
 document.getElementById('f').innerText = cf ?? 0;

 const {data} = await sb.from('profiles').select('full_name,email').limit(20);
 if(data && data.length){
  document.getElementById('lista').innerHTML = data.map(d=>`<div class="py-2 border-b border-zinc-800">${d.full_name||d.email}</div>`).join('');
 } else {
  document.getElementById('lista').innerText = "Conectado OK, pero tabla vacia (0 usuarios) o falta policy";
 }
}
cargar();
