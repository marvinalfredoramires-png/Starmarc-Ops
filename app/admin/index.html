<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starmarc Cloud OPS - ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{display:flex;min-height:100vh;background:#f1f5f9}
.sidebar{width:260px;background:#1e3a8a;color:#fff;display:flex;flex-direction:column}
.logo{padding:20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #2c4aa5}
.menu{padding:20px 0;flex:1}
.menu a{display:flex;gap:12px;padding:12px 20px;color:#cbd5e1;text-decoration:none}
.menu a.active{background:#2c4aa5;color:#fff;border-left:4px solid #60a5fa}
.main{flex:1}
.topbar{background:#1e3a8a;color:#fff;padding:15px 30px;display:flex;justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:20px 0}
.card{background:#dbeafe;padding:18px;border-radius:12px}
.card.active-card{background:#60a5fa;color:#fff}
.card .num{font-size:36px;font-weight:800}
.users-box{background:#fff;border-radius:12px;padding:20px}
table{width:100%;border-collapse:collapse}th{background:#f1f5f9;padding:12px 8px;text-align:left;font-size:12px}td{padding:12px 8px;border-bottom:1px solid #f1f5f9;font-size:14px}
.avatar{width:32px;height:32px;background:#1e3a8a;color:#fff;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;margin-right:8px}
.role{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}.role-master{background:#1e3a8a;color:#fff}.role-user{background:#94a3b8;color:#fff}
</style>
</head>
<body>
<div class="sidebar"><div class="logo">🛡️<div><b>Starmarc Cloud OPS</b><br><small style="color:#93c5fd">ADMIN PANEL</small></div></div><div class="menu"><a class="active">📊 Dashboard</a><a>👥 Users</a><a>🚀 Deployments</a><a>⚙️ Services</a><a>📜 Logs</a></div></div>
<div class="main"><div class="topbar"><h2>Dashboard Overview</h2><div>SA Admin · Superuser</div></div>
<div style="padding:25px 30px"><div class="cards"><div class="card active-card"><div>Total Users</div><div class="num" id="kpiUsers">7</div></div><div class="card"><div>Active Now</div><div class="num">3</div></div><div class="card"><div>Pending Invites</div><div class="num">1</div></div><div class="card"><div>Roles</div><div class="num">2</div></div></div>
<div class="users-box"><h2>Users List</h2><small id="subUsers"></small><table><thead><tr><th>USER</th><th>EMAIL</th><th>ROLE</th><th>STATUS</th><th>LAST LOGIN</th></tr></thead><tbody id="usersTable"></tbody></table></div></div></div>
<script>
const supabaseUrl = 'https://cdffffgheikcmstcmcl.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
async function loadUsers(){
  const {data} = await supabaseClient.from('profiles').select('full_name,email,role,created_at').order('created_at',{ascending:false});
  document.getElementById('kpiUsers').innerText=data.length;
  document.getElementById('subUsers').innerText=`Managing ${data.length} users · Roles: master, user`;
  const tbody=document.getElementById('usersTable');tbody.innerHTML='';
  data.forEach(u=>{
    const ini=(u.full_name||u.email||'U').substring(0,2).toUpperCase();
    tbody.innerHTML+=`<tr><td><span class="avatar">${ini}</span>${u.full_name||'Usuario'}</td><td style="color:#1e40af">${u.email}</td><td><span class="role ${u.role==='master'?'role-master':'role-user'}">${u.role}</span></td><td style="color:#10b981">● Active</td><td>${new Date(u.created_at).toLocaleString()}</td></tr>`;
  });
}
loadUsers();
</script>
</body>
</html>
