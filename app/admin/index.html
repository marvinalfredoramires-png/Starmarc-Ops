<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starmarc-Ops - Búnker Privado</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:Arial;background:#111;color:#fff;padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
  .card{background:#222;border-radius:10px;overflow:hidden;padding:10px}
  .card img,.card video{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#000}
  button{background:#fff;color:#000;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;margin:5px 0}
  input{background:#222;color:#fff;border:1px solid #333;padding:8px;border-radius:6px}
</style>
</head>
<body>
<h2>Starmarc-Ops - Búnker Privado</h2>
<div id="auth">
  <input id="email" placeholder="email" />
  <input id="pass" type="password" placeholder="password" />
  <button onclick="login()">Entrar</button>
  <button onclick="registrar()">Registrar</button>
</div>
<div id="panel" style="display:none">
  <button onclick="logout()">Salir</button>
  <input type="file" id="fileInput" />
  <button onclick="subir()">Subir</button>
  <h3>Mis Archivos</h3>
  <div id="lista" class="grid"></div>
</div>

<script>
const SUPABASE_URL = "https://cdffffghheikcmstcmcl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY";
const BUCKET = "archivos";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  const {error} = await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});
  if(error) return alert(error.message);
  check();
}
async function registrar(){
  const {error} = await sb.auth.signUp({email:document.getElementById('email').value,password:document.getElementById('pass').value});
  if(error) return alert(error.message);
  alert("Revisa tu correo para confirmar");
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function check(){
  const {data:{user}} = await sb.auth.getUser();
  if(user){
    document.getElementById("auth").style.display="none";
    document.getElementById("panel").style.display="block";
    cargarArchivos(user.id);
  }
}

async function subir(){
  const file = document.getElementById("fileInput").files[0];
  if(!file) return alert("Elige archivo");
  const {data:{user}} = await sb.auth.getUser();
  const path = `${user.id}/${Date.now()}-${file.name}`;
  const {error} = await sb.storage.from(BUCKET).upload(path, file);
  if(error) return alert(error.message);
  alert("Subido en privado");
  cargarArchivos(user.id);
}

async function cargarArchivos(uid){
  const lista = document.getElementById("lista");
  lista.innerHTML = "Cargando búnker privado...";
  const {data, error} = await sb.storage.from(BUCKET).list(uid, {limit:100, sortBy:{column:'created_at',order:'desc'}});
  if(error) return lista.innerHTML = error.message;
  if(!data || !data.length) return lista.innerHTML = "Sin archivos";
  
  lista.innerHTML = "";
  for(const f of data){
    if(f.name === ".emptyFolderPlaceholder") continue;
    const fullPath = `${uid}/${f.name}`;
    const {data:signed, error:err2} = await sb.storage.from(BUCKET).createSignedUrl(fullPath, 3600);
    if(err2 || !signed) continue;
    const url = signed.signedUrl;
    const isVideo = f.name.match(/\.(mp4|mov|webm)$/i);
    lista.innerHTML += `
      <div class="card">
        ${isVideo ? `<video src="${url}" controls></video>` : `<img src="${url}" loading="lazy">`}
        <small>${f.name}</small><br>
        <a href="${url}" target="_blank"><button>Ver / Descargar</button></a>
      </div>`;
  }
}
check();
</script>
</body>
</html>
