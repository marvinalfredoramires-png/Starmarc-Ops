<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARMARC ADMIN</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#050507} .glow{box-shadow:0 0 20px rgba(139,92,246,.25),inset 0 0 0 1px rgba(139,92,246,.3)} .card{background:linear-gradient(180deg,#12121a 0%,#0a0a0f 100%)}</style></head><body class="p-4"><div class="max-w-[1400px] mx-auto"><div class="flex justify-between items-center p-4 rounded-2xl bg-[#0a0a0f] glow mb-6"><div class="flex gap-3 items-center"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-500 to-blue-600 flex items-center justify-center">⬢</div><div><p class="font-black text-white leading-none">STARMARC</p><p class="text-[11px] text-violet-400">ADMIN MULTI-USER CLOUD - REAL DATA</p></div></div><div class="flex gap-3 items-center"><input id="q" placeholder="Buscar..." class="bg-[#16161f] rounded-full px-4 py-2 text-sm text-white outline-none border border-zinc-800"><div class="w-8 h-8 rounded-full bg-violet-600 flex items-center justify-center text-xs font-bold">SA</div></div></div><div class="grid grid-cols-4 gap-4 mb-6"><div class="card p-5 rounded-2xl glow"><p class="text-xs text-zinc-400">Total Users</p><p id="tU" class="text-3xl font-black text-white">0</p><p class="text-xs text-green-400 mt-1" id="tUsub">cargando...</p></div><div class="card p-5 rounded-2xl glow"><p class="text-xs text-zinc-400">Total Files</p><p id="tF" class="text-3xl font-black text-white">0</p><p class="text-xs text-green-400 mt-1" id="tFsub"></p></div><div class="card p-5 rounded-2xl glow"><p class="text-xs text-zinc-400">Folders</p><p id="tFo" class="text-3xl font-black text-white">0</p></div><div class="card p-5 rounded-2xl glow"><p class="text-xs text-zinc-400">Status</p><p class="text-xl font-bold text-green-400">Connected</p><p class="text-[11px] text-zinc-400">anon key OK</p></div></div><div class="grid grid-cols-12 gap-5"><div class="col-span-12 md:col-span-4 card rounded-2xl glow p-5"><div class="flex justify-between mb-4"><h2 class="font-bold text-white">User Folders</h2><button onclick="newF()" class="w-7 h-7 rounded-full bg-zinc-800 text-white">+</button></div><div id="uList" class="space-y-2"></div></div><div class="col-span-12 md:col-span-8 card rounded-2xl glow p-5"><div class="flex justify-between mb-4"><h2 class="font-bold text-white">Recent Files</h2><button onclick="newF()" class="px-3 py-1 rounded-full bg-violet-600 text-sm text-white">+ Upload</button></div><div id="fList" class="space-y-2"></div></div></div></div><script>
const supa=supabase.createClient("https://cdffffgheikcmstcmcl.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY");
let cur="";
async function load(){
const {data:all, error}=await supa.storage.from("archivos").list(cur,{limit:1000});
if(error){document.getElementById("fList").innerHTML="<p class='text-red-400 p-5'>Error: "+error.message+"</p>";console.error(error);return;}
if(!all||all.length==0){document.getElementById("fList").innerHTML="<p class='text-zinc-500 p-10 text-center'>Vacio en "+(cur||"root")+"</p>";return;}
const folders=all.filter(x=>!x.metadata || x.metadata===null);
const files=all.filter(x=>x.metadata && x.metadata!==null);
if(cur===""){
document.getElementById("tU").innerText=folders.length;
document.getElementById("tFo").innerText=folders.length;
document.getElementById("tF").innerText=all.length;
document.getElementById("tUsub").innerText=folders.length+" usuarios reales";
document.getElementById("tFsub").innerText=files.length+" archivos en root";
}
const uList=document.getElementById("uList");
if(cur===""){
uList.innerHTML=`<div onclick="openF('')" class="p-3 rounded-xl bg-violet-600/20 cursor-pointer flex justify-between border border-violet-500"><span class="text-white text-sm">📁 Root (${all.length})</span><span class="text-xs text-zinc-400">Todo</span></div>`;
folders.forEach(f=>{
const d=document.createElement("div");
d.className=`p-3 rounded-xl bg-[#1a1a23] hover:bg-[#222230] cursor-pointer flex justify-between ${cur===f.name?'border border-violet-500':''}`;
d.innerHTML=`<span class="text-white text-sm truncate">📁 ${f.name.substring(0,22)}</span><span class="text-xs text-zinc-500">→</span>`;
d.onclick=()=>openF(f.name);
uList.appendChild(d);
});
}
const fList=document.getElementById("fList");
fList.innerHTML="";
if(cur!==""){
const b=document.createElement("button");
b.className="mb-3 text-xs text-violet-400";
b.innerText="← Volver a Root";
b.onclick=()=>openF("");
fList.appendChild(b);
}
all.forEach(f=>{
const isFolder=!f.metadata;
const path=cur?cur+"/"+f.name:f.name;
const r=document.createElement("div");
r.className="flex justify-between items-center p-3 rounded-xl bg-[#1a1a23]";
if(isFolder){
r.innerHTML=`<div class="flex gap-2 cursor-pointer" onclick="openF('${path}')"><span>📁</span><span class="text-sm text-white">${f.name}</span></div><span class="text-xs text-violet-400">Abrir →</span>`;
}else{
const size=f.metadata?.size? (f.metadata.size/1024).toFixed(1)+" KB":"";
r.innerHTML=`<div class="flex gap-2 items-center"><div class="w-8 h-8 rounded bg-violet-600/20 flex items-center justify-center text-[9px] text-violet-300">${f.name.split('.').pop().substring(0,4)}</div><div><p class="text-sm text-white truncate max-w-[160px]">${f.name}</p><p class="text-[10px] text-zinc-500">${size}</p></div></div><div class="flex gap-2"><button onclick="copyL('${path}')" class="text-xs px-3 py-1 rounded-full border border-violet-500/40 text-violet-300">Link</button><button onclick="delF('${path}')" class="text-xs px-3 py-1 rounded-full border border-red-500/30 text-red-400">Del</button></div>`;
}
fList.appendChild(r);
});
}
function openF(n){cur=n;load()}
async function delF(p){if(!confirm("Borrar "+p+"?"))return;await supa.storage.from("archivos").remove([p]);load()}
async function newF(){const n=prompt("Nombre carpeta:");if(!n)return;await supa.storage.from("archivos").upload(n+"/.keep",new Blob([""]),{upsert:true});load()}
function copyL(p){const u=`https://cdffffgheikcmstcmcl.supabase.co/storage/v1/object/public/archivos/${p}`;navigator.clipboard.writeText(u);alert("Link copiado")}
document.getElementById("q").addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#fList > div").forEach(d=>{d.style.display=d.innerText.toLowerCase().includes(q)?"flex":"none"})});
load();
</script></body></html>
