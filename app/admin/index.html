<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARMARC ADMIN - Multi Usuario</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#050507] text-white min-h-screen p-4">
<div class="max-w-7xl mx-auto">
<div class="flex justify-between items-center p-5 mb-6 rounded-2xl bg-[#0a0a0f] border border-violet-500/20">
<h1 class="font-black text-xl">⬢ STARMARC <span class="text-violet-400 font-normal text-sm">ADMIN MULTI-USER CLOUD</span></h1>
<div class="flex gap-3">
<input id="q" placeholder="Search files, users..." class="bg-zinc-900 rounded-full px-4 py-2 text-sm outline-none">
<div class="w-8 h-8 rounded-full bg-violet-600 flex items-center justify-center text-xs font-bold">SA</div>
</div>
</div>
<div class="grid grid-cols-4 gap-4 mb-6">
<div class="p-5 rounded-2xl bg-[#0f0f13] border border-violet-500/30"><p class="text-xs text-zinc-400">Total Users</p><p id="tU" class="text-3xl font-black mt-1">0</p></div>
<div class="p-5 rounded-2xl bg-[#0f0f13] border border-violet-500/30"><p class="text-xs text-zinc-400">Total Files</p><p id="tF" class="text-3xl font-black mt-1">0</p></div>
<div class="p-5 rounded-2xl bg-[#0f0f13] border border-violet-500/30"><p class="text-xs text-zinc-400">Folders</p><p id="tFo" class="text-3xl font-black mt-1">0</p></div>
<div class="p-5 rounded-2xl bg-[#0f0f13] border border-green-500/20"><p class="text-xs text-zinc-400">Operational Status</p><p class="text-xl font-bold text-green-400 mt-1">Operational</p></div>
</div>
<div class="grid grid-cols-12 gap-4">
<div class="col-span-4 rounded-2xl bg-[#0f0f13] border border-violet-500/20 p-4">
<div class="flex justify-between mb-4"><h2 class="font-bold">User Folders</h2><button onclick="newF()" class="w-7 h-7 rounded-full bg-zinc-800">+</button></div>
<div id="uList" class="space-y-2 max-h-[500px] overflow-auto"></div>
</div>
<div class="col-span-8 rounded-2xl bg-[#0f0f13] border border-violet-500/20 p-4">
<div class="flex justify-between mb-4"><h2 class="font-bold">Recent Files</h2><button onclick="newF()" class="px-3 py-1 rounded-full bg-violet-600 text-sm">+ Upload</button></div>
<div id="fList" class="space-y-2 max-h-[500px] overflow-auto"></div>
</div>
</div>
</div>
<script>
const supa=supabase.createClient("https://cdffffgheikcmstcmcl.supabase.co","sb_publishable_otcfh8jx0UppsEePiD3egw_BE_P7vRF");
let cur="";
async function load(){
const {data:all}=await supa.storage.from("archivos").list("",{limit:1000});
if(!all){document.getElementById("fList").innerHTML="<p class='p-10 text-center text-zinc-500'>Bucket vacio</p>";return;}
const folders=all.filter(x=>!x.metadata);
const files=all.filter(x=>x.metadata);
document.getElementById("tFo").innerText=folders.length;
document.getElementById("tF").innerText=all.length;
document.getElementById("tU").innerText=folders.length||files.length;
const ul=document.getElementById("uList");
ul.innerHTML=`<div onclick="openF('')" class="p-3 rounded-xl bg-violet-600/20 cursor-pointer flex justify-between ${cur===''?'border border-violet-500':''}"><span>📁 Todos</span><span class="text-xs">${all.length}</span></div>`;
folders.forEach(f=>{
const d=document.createElement("div");
d.className=`p-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 cursor-pointer flex justify-between ${cur===f.name?'border border-violet-500':''}`;
d.innerHTML=`<span>📁 ${f.name}</span>`;
d.onclick=()=>openF(f.name);
ul.appendChild(d)
});
let toRender=all;
if(cur!==""){
const {data}=await supa.storage.from("archivos").list(cur,{limit:1000});
toRender=data||[];
}
const fl=document.getElementById("fList");
fl.innerHTML="";
if(!toRender.length)fl.innerHTML="<p class='text-center text-zinc-500 p-10'>Vacio</p>";
toRender.forEach(f=>{
const isF=!f.metadata;
const path=cur?cur+"/"+f.name:f.name;
const r=document.createElement("div");
r.className="flex justify-between items-center p-3 rounded-xl bg-zinc-900";
r.innerHTML=isF?`<div class='flex gap-2 cursor-pointer' onclick="openF('${path}')"><span>📁</span><span class='text-sm'>${f.name}</span></div><span class='text-xs'>→</span>`:`<div class='flex gap-2'><div class='w-8 h-8 rounded bg-violet-600/20 flex items-center justify-center text-[10px]'>FILE</div><div><p class='text-sm'>${f.name}</p><p class='text-[10px] text-zinc-500'>${(f.metadata.size/1024).toFixed(1)} KB</p></div></div><div class='flex gap-2'><button onclick="copyL('${path}')" class='text-xs px-3 py-1 rounded-full border border-violet-500/30 text-violet-300'>Link</button><button onclick="delF('${path}')" class='text-xs px-3 py-1 rounded-full border border-red-500/30 text-red-400'>Delete</button></div>`;
fl.appendChild(r)
});
}
function openF(n){cur=n;load()}
async function delF(p){if(!confirm("Borrar "+p+"?"))return;await supa.storage.from("archivos").remove([p]);load()}
async function newF(){const n=prompt("Nombre carpeta usuario:");if(!n)return;await supa.storage.from("archivos").upload(n+"/.keep",new Blob([""]),{upsert:true});load()}
function copyL(p){const u=`https://cdffffgheikcmstcmcl.supabase.co/storage/v1/object/public/archivos/${p}`;navigator.clipboard.writeText(u);alert("Link copiado: "+u)}
document.getElementById("q").addEventListener("input",e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#fList > div").forEach(d=>{d.style.display=d.innerText.toLowerCase().includes(q)?"flex":"none"})});
load();
</script>
</body>
</html>
