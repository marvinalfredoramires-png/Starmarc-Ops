<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARMARC CLOUD OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#050507] text-white min-h-screen p-8">
<div class="max-w-6xl mx-auto">
<div class="flex justify-between items-center">
<h1 class="text-4xl font-black tracking-tighter">STARMARC<span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 via-fuchsia-500 to-blue-500"> CLOUD OS</span></h1>
<label class="cursor-pointer px-6 py-3 rounded-full bg-gradient-to-r from-violet-600 to-blue-600 font-bold text-sm shadow-[0_0_30px_rgba(124,58,237,0.5)] hover:scale-105 transition">+ Subir Archivo<input type="file" id="fileInput" class="hidden"></label>
</div>
<div class="mt-10 rounded-[24px] bg-zinc-900 border border-zinc-800 overflow-hidden">
<div class="p-6 border-b border-zinc-800 flex justify-between items-center"><h2 class="font-bold">Control Total - Bucket archivos</h2><span class="text-xs px-3 py-1 rounded-full bg-green-500/10 text-green-400">Conectado</span></div>
<div id="lista" class="divide-y divide-zinc-800/50"></div>
</div>
</div>
<script>
const supabase = window.supabase.createClient("https://cdffffgheikcmstcmcl.supabase.co", "sb_publishable_otcfh8jx0UppsEePiD3egw_BE_P7vRF");
async function load(){
  const {data} = await supabase.storage.from("archivos").list("", {limit:100, sortBy:{column:'created_at', order:'desc'}});
  const lista = document.getElementById("lista");
  lista.innerHTML="";
  if(!data || data.length==0){ lista.innerHTML="<p class='p-16 text-center text-zinc-500'>Vacío. Sube tu primer archivo.</p>"; return; }
  data.forEach(f=>{
    const row=document.createElement("div");
    row.className="flex justify-between items-center p-5 hover:bg-violet-500/[0.06]";
    row.innerHTML=`<div class="flex gap-4 items-center"><div class="w-11 h-11 rounded-xl bg-gradient-to-br from-violet-600 to-blue-600 flex items-center justify-center font-black">S</div><div><p class="font-bold text-sm">${f.name}</p><p class="text-[11px] text-zinc-500">${new Date(f.created_at).toLocaleString()}</p></div></div><div class="flex gap-2"><button onclick="navigator.clipboard.writeText('https://cdffffgheikcmstcmcl.supabase.co/storage/v1/object/public/archivos/${f.name}');alert('Link copiado!')" class="text-xs px-4 py-2 rounded-full bg-zinc-800 hover:bg-zinc-700">Link</button><button onclick="borrar('${f.name}')" class="text-xs px-4 py-2 rounded-full bg-red-500/10 text-red-400">Borrar</button></div>`;
    lista.appendChild(row);
  });
}
async function borrar(name){ if(!confirm("¿Borrar "+name+"?")) return; await supabase.storage.from("archivos").remove([name]); load(); }
document.getElementById("fileInput").addEventListener("change", async (e)=>{
  const file=e.target.files[0]; if(!file) return;
  if(file.size > 50*1024*1024){ alert("Max 50MB"); return; }
  const {error}=await supabase.storage.from("archivos").upload(file.name, file, {upsert:true});
  if(error) alert(error.message); else load();
});
load();
</script>
</body>
</html>
