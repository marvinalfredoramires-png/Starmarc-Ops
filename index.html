<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starmarc Cloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#0a102a;color:#fff;font-family:system-ui}
.glass{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(12px)}
.card-folder{background:#1c244a;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
.folder-menu{padding:13px 16px;border-radius:14px;cursor:pointer;display:flex;gap:12px;align-items:center;color:#8da2d6;font-size:14px}
.folder-menu.active{background:#0eb6ff;color:#fff;font-weight:700}
#sidebar{transform:translateX(-100%);transition:.3s}
#sidebar.open{transform:translateX(0)}
@media(min-width:1024px){#sidebar{transform:translateX(0)}}
</style>
</head>
<body>
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass rounded-[24px] p-8 w-full max-w-[400px] text-center">
    <div class="text-5xl">☁️</div><h2 class="text-2xl font-black mt-2">Mis Archivos</h2>
    <p class="text-white/60 text-sm mb-6">Búnker Privado</p>
    <input id="email" type="email" placeholder="correo" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none mb-3">
    <input id="pass" type="password" placeholder="contraseña" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none">
    <button class="w-full bg-[#1a6cff] p-3 rounded-xl mt-4 font-bold" onclick="loginEmail()">Iniciar</button>
    <p id="msg" class="mt-4 text-red-400 text-sm"></p>
  </div>
</div>
<div id="appPage" class="hidden min-h-screen flex">
  <aside id="sidebar" class="fixed lg:static z-40 top-0 left-0 w-[300px] h-full bg-[#0f1836] border-r border-white/10 p-5 flex flex-col">
    <div class="mb-6">
      <div class="font-black text-xl">☁️✨ Starmarc Cloud</div>
      <div id="espacioTxt" class="text-[11px] text-white/50 mt-2">Calculando...</div>
      <div class="w-full h-1 bg-white/10 rounded-full mt-2"><div id="barraUso" class="h-1 bg-[#0eb6ff] rounded-full" style="width:10%"></div></div>
    </div>
    <div class="space-y-1">
      <div class="folder-menu active" onclick="cambiarCarpeta('',this)"><i class="fa-regular fa-folder"></i> Todo</div>
      <div class="folder-menu" onclick="cambiarCarpeta('imagenes',this)"><i class="fa-regular fa-image"></i> Imagenes</div>
      <div class="folder-menu" onclick="cambiarCarpeta('videos',this)"><i class="fa-solid fa-video"></i> Videos</div>
      <div class="folder-menu" onclick="cambiarCarpeta('documentos',this)"><i class="fa-regular fa-file-lines"></i> Documentos</div>
    </div>
    <div class="mt-auto space-y-3">
      <button onclick="abrirAjustes()" class="w-full glass py-3 rounded-xl text-sm font-bold flex items-center gap-3 px-4"><i class="fa-solid fa-gear"></i> Configuración / Ajustes</button>
      <div class="glass rounded-2xl p-3 flex items-center gap-3">
        <div id="avatar" class="w-10 h-10 rounded-full bg-[#0eb6ff] flex items-center justify-center font-bold">U</div>
        <div><div id="userNombre" class="text-sm font-bold">Usuario</div><div id="userEmail" class="text-[11px] text-white/50">...</div></div>
      </div>
      <button onclick="logout()" class="mt-1 text-xs text-white/50">Cerrar sesión</button>
      <button onclick="limpiarSueltos()" class="mt-1 text-[11px] text-red-300/50 underline w-full text-left">Limpiar archivos sueltos</button>
    </div>
  </aside>
  <div id="overlay" class="hidden fixed inset-0 bg-black/60 z-30 lg:hidden"></div>
  <main class="flex-1 min-h-screen">
    <header class="px-6 py-4 flex items-center justify-between">
      <button id="btnMenu" class="lg:hidden w-10 h-10 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-bars"></i></button>
      <h1 id="titulo" class="font-black text-xl">Carpetas</h1>
      <button id="btnUploadPlus" class="w-10 h-10 rounded-full bg-[#1a6cff] flex items-center justify-center font-bold text-xl">+</button>
    </header>
    <div class="px-6"><div class="glass rounded-full px-4 py-3 flex items-center gap-3 text-white/40"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Buscar..." class="bg-transparent outline-none text-white text-sm w-full"></div></div>
    <div class="p-6"><div id="lista" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">Cargando...</div></div>
  </main>
</div>

<!-- MODAL AJUSTES - NUEVO -->
<div id="modalAjustes" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-[#101a3a] border border-white/10 rounded-[24px] w-full max-w-[420px] p-6">
    <div class="flex justify-between items-center mb-6"><h2 class="font-black text-xl">⚙️ Ajustes</h2><button onclick="cerrarAjustes()" class="w-9 h-9 rounded-full glass flex items-center justify-center">✕</button></div>
    <div class="space-y-4">
      <div class="glass rounded-2xl p-4"><div class="text-xs text-white/50 uppercase">Cuenta</div><div id="ajustesEmail" class="font-bold text-sm mt-2">...</div><div id="ajustesUid" class="text-[10px] text-white/30 mt-1 break-all">ID: ...</div></div>
      <div class="glass rounded-2xl p-4"><div class="text-xs text-white/50 uppercase">Almacenamiento REAL</div><div class="flex justify-between mt-3 text-sm"><span>🖼️ Imágenes</span><span id="countImg">0</span></div><div class="flex justify-between mt-2 text-sm"><span>🎬 Videos</span><span id="countVid">0</span></div><div class="flex justify-between mt-2 text-sm"><span>📄 Documentos</span><span id="countDoc">0</span></div><div class="mt-4 w-full h-2 bg-white/10 rounded-full"><div id="barraAjustes" class="h-2 bg-[#0eb6ff] rounded-full" style="width:10%"></div></div><div id="totalUso" class="text-[11px] text-white/50 mt-2">0 MB</div></div>
      <button onclick="cambiarPass()" class="w-full glass py-3 rounded-xl text-sm font-bold">🔑 Cambiar contraseña</button>
      <button onclick="borrarTodo()" class="w-full bg-red-500/10 border border-red-500/20 text-red-300 py-3 rounded-xl text-sm font-bold">🗑️ Borrar todo mi búnker</button>
      <div class="text-[11px] text-white/20 text-center pt-2">Starmarc Ops • Datos Reales</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://cdffffghheikcmstcmcl.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY";
const BUCKET="archivos";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let uidActual=null, carpetaActual="", cacheArchivos={imagenes:[],videos:[],documentos:[]}, userActual=null;

document.getElementById('btnMenu').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.remove('hidden');}
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.add('hidden');}
document.getElementById('btnUploadPlus').onclick=()=>document.getElementById('fileInput')?document.getElementById('fileInput').click():document.createElement('input').click();
const fileInput=document.createElement('input'); fileInput.type='file'; fileInput.id='fileInput'; fileInput.style.display='none'; document.body.appendChild(fileInput);
fileInput.onchange=()=>subir();

(async()=>{const{data:{session}}=await sb.auth.getSession();if(session?.user) mostrarApp(session.user);})();
async function loginEmail(){const e=document.getElementById('email').value.trim();const p=document.getElementById('pass').value;if(!e||!p) return document.getElementById('msg').innerText="Pon correo";const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error) return document.getElementById('msg').innerText=error.message;mostrarApp(data.user);}
function mostrarApp(u){uidActual=u.id;userActual=u;document.getElementById('loginPage').style.display='none';document.getElementById('appPage').style.display='flex';document.getElementById('userEmail').innerText=u.email;document.getElementById('userNombre').innerText=u.email.split('@')[0];document.getElementById('avatar').innerText=u.email[0].toUpperCase();cargarArchivos();}
function cambiarCarpeta(c,el){carpetaActual=c;document.querySelectorAll('.folder-menu').forEach(f=>f.classList.remove('active'));if(el) el.classList.add('active');document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.add('hidden');render();}

async function cargarArchivos(){
  cacheArchivos={imagenes:[],videos:[],documentos:[]};
  let total=0;
  for(const sub of ['imagenes','videos','documentos']){
    const {data}=await sb.storage.from(BUCKET).list(`${uidActual}/${sub}`,{limit:200, sortBy:{column:'created_at', order:'desc'}});
    if(data){ cacheArchivos[sub]=data.filter(f=>f.name!==".emptyFolderPlaceholder"); cacheArchivos[sub].forEach(f=>{if(f.metadata?.size) total+=f.metadata.size;}); }
  }
  document.getElementById('espacioTxt').innerText=`Usado: ${(total/1024/1024).toFixed(1)} MB / 50 GB`;
  document.getElementById('barraUso').style.width=Math.min(100, total/1024/1024/10)+"%";
  render();
}
async function getUrl(sub,file){
  const {data}=await sb.storage.from(BUCKET).createSignedUrl(`${uidActual}/${sub}/${file.name}`, 86400);
  return data?.signedUrl;
}
async function render(){
  const lista=document.getElementById('lista'); lista.innerHTML="";
  if(carpetaActual===""){
    document.getElementById('titulo').innerText="Carpetas";
    for(const sub of ['imagenes','videos','documentos']){
      const files=cacheArchivos[sub]||[]; const ultimo=files[0];
      let thumb=`<div class='h-full w-full bg-[#151e3d] flex items-center justify-center text-4xl opacity-50'>${sub==='imagenes'?'🖼️':sub==='videos'?'🎬':'📄'}</div>`;
      if(ultimo){ const url=await getUrl(sub,ultimo); if(url){ thumb=sub==='videos'?`<video src="${url}" muted class="w-full h-full object-cover"></video>`:`<img src="${url}" class="w-full h-full object-cover">`; } }
      const mb=files.reduce((a,b)=>a+(b.metadata?.size||0),0)/1024/1024;
      const div=document.createElement('div'); div.className="card-folder cursor-pointer";
      div.onclick=()=>cambiarCarpeta(sub, document.querySelectorAll('.folder-menu')[sub==='imagenes'?1:sub==='videos'?2:3]);
      div.innerHTML=`<div class="h-[200px] overflow-hidden">${thumb}</div><div class="p-4 bg-[#1e2a5a]"><div class="font-bold flex gap-2 items-center">${sub.toUpperCase()}</div><div class="text-xs text-white/60 mt-1">${files.length} archivos • ${mb.toFixed(2)} MB</div></div>`;
      lista.appendChild(div);
    }
    return;
  }
  const archivos=cacheArchivos[carpetaActual]||[]; document.getElementById('titulo').innerText=carpetaActual;
  if(!archivos.length){ lista.innerHTML=`<div class='glass p-10 text-center rounded-2xl'>Vacía</div>`; return; }
  for(const f of archivos){
    const url=await getUrl(carpetaActual,f); if(!url) continue;
    const nombre=f.name.split('-').slice(1).join('-')||f.name;
    const card=document.createElement('div'); card.className="card-folder p-2";
    card.innerHTML=`<div class="rounded-xl overflow-hidden h-[200px] bg-black">${carpetaActual==='videos'?`<video src="${url}" controls class="w-full h-full object-cover"></video>`:`<img src="${url}" class="w-full h-full object-cover">`}</div><div class="p-2"><div class="text-sm font-bold truncate">${nombre}</div><div class="flex gap-2 mt-2"><a href="${url}" target="_blank" class="flex-1 glass py-2 rounded-full text-center text-xs">Ver</a><a href="${url}" download class="flex-1 bg-[#1a6cff] py-2 rounded-full text-center text-xs font-bold">Descargar</a></div></div>`;
    lista.appendChild(card);
  }
}
async function subir(){
  const file=fileInput.files[0]; if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase(); let sub="documentos"; if(['jpg','jpeg','png','webp','heic','gif'].includes(ext)) sub="imagenes"; if(['mp4','mov','webm','avi'].includes(ext)) sub="videos";
  const dest=carpetaActual||sub;
  const {error}=await sb.storage.from(BUCKET).upload(`${uidActual}/${dest}/${Date.now()}-${file.name}`, file, {upsert:true});
  if(error) alert(error.message); fileInput.value=""; await cargarArchivos(); cambiarCarpeta(dest, document.querySelectorAll('.folder-menu')[dest==='imagenes'?1:dest==='videos'?2:3]);
}
async function limpiarSueltos(){
  if(!confirm("¿Borrar archivos que están sueltos fuera de carpetas para limpiar el desorden?")) return;
  const {data}=await sb.storage.from(BUCKET).list(`${uidActual}`,{limit:100});
  if(data){ for(const f of data){ if(!['imagenes','videos','documentos'].includes(f.name) && f.name!==".emptyFolderPlaceholder"){ await sb.storage.from(BUCKET).remove([`${uidActual}/${f.name}`]); } } }
  alert("Limpieza hecha"); cargarArchivos();
}
// --- SOLO ESTO ES NUEVO ---
function abrirAjustes(){
  document.getElementById('modalAjustes').classList.remove('hidden');
  document.getElementById('ajustesEmail').innerText=userActual?.email||document.getElementById('userEmail').innerText;
  document.getElementById('ajustesUid').innerText='ID: '+uidActual;
  document.getElementById('countImg').innerText=(cacheArchivos.imagenes?.length||0)+' archivos';
  document.getElementById('countVid').innerText=(cacheArchivos.videos?.length||0)+' archivos';
  document.getElementById('countDoc').innerText=(cacheArchivos.documentos?.length||0)+' archivos';
  const total=Object.values(cacheArchivos).flat().reduce((a,b)=>a+(b.metadata?.size||0),0);
  document.getElementById('totalUso').innerText=`${(total/1024/1024).toFixed(1)} MB / 50 GB usados`;
  document.getElementById('barraAjustes').style.width=document.getElementById('barraUso').style.width;
}
function cerrarAjustes(){document.getElementById('modalAjustes').classList.add('hidden');}
async function cambiarPass(){const n=prompt("Nueva contraseña (min 6):");if(!n||n.length<6)return alert("Muy corta");const{error}=await sb.auth.updateUser({password:n});if(error)alert(error.message);else alert("Cambiada ✅");}
async function borrarTodo(){if(!confirm("¿Borrar TODO tu búnker? No se puede recuperar"))return;if(!confirm("Última confirmación ¿Borrar TODO?"))return;for(const s of ['imagenes','videos','documentos']){for(const f of cacheArchivos[s]){await sb.storage.from(BUCKET).remove([`${uidActual}/${s}/${f.name}`]);}}alert("Búnker limpio");cerrarAjustes();cargarArchivos();}
async function logout(){await sb.auth.signOut(); location.reload();}
</script>
</body>
</html>
