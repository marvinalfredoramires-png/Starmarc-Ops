<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Archivos - Starmarc Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui;background:radial-gradient(ellipse at top,#1a2340 0%,#0a0e1a 70%);color:#fff;min-height:100vh}
.login{max-width:360px;margin:80px auto;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);padding:24px;border-radius:24px;text-align:center}
.login input{width:100%;padding:14px;margin:8px 0;border-radius:14px;border:0;background:#e8e8ef;color:#111;box-sizing:border-box}
.btn{width:100%;padding:14px;border-radius:14px;border:0;font-weight:700;cursor:pointer}
.btn-blue{background:#2f6bff;color:#fff}.btn-google{background:#fff;color:#111;display:flex;gap:8px;justify-content:center;margin-top:14px}
#app{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px}
.search{width:calc(100% - 32px);margin:0 16px;padding:12px 16px;border-radius:14px;border:1px solid #1e253e;background:#151a2d;color:#fff;box-sizing:border-box}
.content{padding:16px;max-width:700px;margin:0 auto}
.folder-card{display:flex;justify-content:space-between;align-items:center;background:#151a2d;border:1px solid #1e253e;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.folder-card b{font-size:15px}
.card{background:#151a2d;border:1px solid #1e253e;border-radius:16px;padding:12px;margin-bottom:12px}
.card img,.card video{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#000}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:10px;border-radius:10px;border:0;font-weight:600}
.btn-ver{background:#2a2f4a;color:#fff}.btn-down{background:#2f6bff;color:#fff}.btn-x{background:#3a1e1e;color:#ff8e8e;width:44px;flex:none}
#sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#0f1426;border-right:1px solid #1e253e;transition:0.3s;z-index:100;padding:20px}
#sidebar.open{left:0}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;z-index:90}
#overlay.show{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#1e253e;border-radius:20px 20px 0 0;padding:20px;display:none;z-index:110}
.breadcrumb{display:flex;gap:6px;align-items:center;margin-bottom:12px;color:#8b9dcf}
</style>
</head>
<body>

<div id="loginBox" class="login">
<div style="font-size:28px">☁️</div><h2>Mis Archivos</h2><small style="color:#8b9dcf">Starmarc Cloud</small>
<h3 style="margin-top:18px">Iniciar sesión</h3>
<input id="email" type="email" placeholder="correo"><input id="pass" type="password" placeholder="contraseña">
<button class="btn btn-blue" onclick="login()">Iniciar Sesión</button>
<div style="margin:12px 0;color:#8b9dcf;font-size:13px">o continuar con</div>
<button class="btn btn-google" onclick="loginGoogle()">Continuar con Google</button>
<div style="margin-top:14px;font-size:13px"><a onclick="registrar()" style="color:#2f6bff;cursor:pointer">Regístrate</a></div>
<div id="msg" style="margin-top:10px;color:#ff8e8e;font-size:13px"></div>
</div>

<div id="overlay" onclick="closeMenu()"></div>
<div id="sidebar">
<h3>☁️ Starmarc</h3>
<div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">
<button onclick="goFolder('todo');closeMenu()" class="btn" style="text-align:left;background:#1e253e;color:#fff">📁 Todo</button>
<button onclick="goFolder('imagenes');closeMenu()" class="btn" style="text-align:left;background:#1e253e;color:#fff">🖼️ Imágenes</button>
<button onclick="goFolder('videos');closeMenu()" class="btn" style="text-align:left;background:#1e253e;color:#fff">🎬 Videos</button>
<button onclick="goFolder('documentos');closeMenu()" class="btn" style="text-align:left;background:#1e253e;color:#fff">📄 Documentos</button>
<hr style="border-color:#1e253e">
<button onclick="logout()" class="btn" style="text-align:left;background:transparent;color:#ff8e8e">Salir</button>
</div>
</div>

<div id="app">
<div class="topbar"><button onclick="openMenu()" style="background:#151a2d;border:1px solid #1e253e;color:#fff;padding:8px 12px;border-radius:10px">☰</button><div><b>☁️ Mis Archivos</b></div><button onclick="document.getElementById('sheet').style.display='block'" style="background:#2f6bff;border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px">+</button></div>
<input class="search" id="buscar" placeholder="🔍 Buscar en mis archivos..." oninput="pintar()">
<div class="content">
<div id="breadcrumb" class="breadcrumb"></div>
<small id="sub" style="color:#8b9dcf">Tus archivos son privados, solo tú los ves</small>
<div id="lista" style="margin-top:12px">Cargando...</div>
</div>
</div>

<div id="sheet" class="sheet">
<div style="display:flex;justify-content:space-around">
<button onclick="fileInput.click()" style="background:none;border:0;color:#fff">📷<br>Fotos</button>
<button onclick="fileInput.click()" style="background:none;border:0;color:#fff">🎬<br>Videos</button>
<button onclick="fileInput.click()" style="background:none;border:0;color:#fff">📄<br>Archivos</button>
</div>
<button onclick="document.getElementById('sheet').style.display='none'" style="width:100%;margin-top:16px;background:none;border:0;color:#aaa">Cerrar</button>
<input type="file" id="fileInput" hidden multiple onchange="subirFiles(this.files)">
</div>

<script>
const SUPA_URL='https://cdffffghheikcmstcmcl.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY';
const BUCKET='archivos';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let todos=[]; let carpetaActiva='todo';
function openMenu(){sidebar.classList.add('open');overlay.classList.add('show')}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}
sb.auth.onAuthStateChange((e,s)=>{ if(s){ loginBox.style.display='none'; app.style.display='block'; cargar(); } });
(async()=>{ const {data}=await sb.auth.getSession(); if(data.session){ loginBox.style.display='none'; app.style.display='block'; cargar(); } })();
async function login(){ const e=email.value.trim(), p=pass.value.trim(); const {error}=await sb.auth.signInWithPassword({email:e,password:p}); if(error) msg.innerText=error.message; }
async function registrar(){ const e=email.value.trim(), p=pass.value.trim(); const {error}=await sb.auth.signUp({email:e,password:p}); if(error) msg.innerText=error.message; }
function loginGoogle(){ sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: window.location.href}}) }
function getCarpeta(n){ const ext=n.split('.').pop().toLowerCase(); if(['jpg','jpeg','png','webp','gif'].includes(ext)) return 'imagenes'; if(['mp4','mov','avi','webm','mkv'].includes(ext)) return 'videos'; return 'documentos'; }
async function subirFiles(files){
 const {data:{user}}=await sb.auth.getUser();
 // si está dentro de una carpeta, sube a esa carpeta, si está en todo, detecta automático
 for(let f of files){
  sub.innerText='Subiendo '+f.name+'...';
  let carp=carpetaActiva=='todo'? getCarpeta(f.name) : carpetaActiva;
  const ruta=`${user.id}/${carp}/${Date.now()}_${f.name}`;
  await sb.storage.from(BUCKET).upload(ruta,f);
 }
 sheet.style.display='none'; cargar();
}
async function cargar(){
 const {data:{user}}=await sb.auth.getUser(); if(!user) return;
 todos=[];
 for(let c of ['imagenes','videos','documentos']){
  const {data}=await sb.storage.from(BUCKET).list(`${user.id}/${c}`,{limit:100,sortBy:{column:'created_at',order:'desc'}});
  if(data){ for(let f of data){ if(f.name!='.emptyFolderPlaceholder') todos.push({carpeta:c,file:f,path:`${user.id}/${c}/${f.name}`}) } }
 }
 pintar();
}
function goFolder(c){ carpetaActiva=c; pintar(); }
function pintar(){
 const l=document.getElementById('lista'); const bc=document.getElementById('breadcrumb');
 const q=buscar.value.toLowerCase();
 let lista=todos.filter(t=>!q || t.file.name.toLowerCase().includes(q));

 if(carpetaActiva=='todo'){
  bc.innerHTML=`<span>📁 Mis Archivos</span>`;
  // Agrupar por carpetas
  const grupos={};
  for(let t of lista){ if(!grupos[t.carpeta]) grupos[t.carpeta]=[]; grupos[t.carpeta].push(t); }
  let html='';
  for(let carpeta of ['imagenes','videos','documentos']){
   const count=grupos[carpeta]?.length||0;
   const icon=carpeta=='imagenes'?'🖼️':carpeta=='videos'?'🎬':'📄';
   html+=`<div class="folder-card" onclick="goFolder('${carpeta}')"><div><b>${icon} ${carpeta.charAt(0).toUpperCase()+carpeta.slice(1)}</b><br><small style="color:#8b9dcf">${count} archivos</small></div><div>›</div></div>`;
  }
  l.innerHTML=html || 'No hay archivos';
  sub.innerText='Ordenado por carpetas';
 } else {
  bc.innerHTML=`<span style="cursor:pointer" onclick="goFolder('todo')">📁 Mis Archivos</span> › <b>${carpetaActiva}</b> <span style="cursor:pointer;margin-left:auto;color:#2f6bff" onclick="goFolder('todo')">← Volver</span>`;
  let filtrados=lista.filter(t=>t.carpeta==carpetaActiva);
  sub.innerText=`${filtrados.length} archivos en ${carpetaActiva}`;
  if(filtrados.length==0){ l.innerHTML='No hay archivos en esta carpeta'; return;}
  l.innerHTML=filtrados.map(t=>{
   const raw=t.file.name; const nombreReal=raw.includes('_')? raw.split('_').slice(1).join('_') : raw;
   const url=`${SUPA_URL}/storage/v1/object/public/${BUCKET}/${t.path}`;
   const isImg=/\.(jpg|jpeg|png|webp|gif)$/i.test(nombreReal);
   const isVid=/\.(mp4|mov|webm)$/i.test(nombreReal);
   let prev=isImg?`<img src="${url}">`:isVid?`<video src="${url}" controls></video>`:`<div style="padding:30px;text-align:center;font-size:30px">📄</div>`;
   return `<div class="card">${prev}<div style="margin-top:8px"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nombreReal}</div><small style="color:#8b9dcf">${(t.file.metadata?.size/1024/1024).toFixed(2)} MB • ${new Date(t.file.created_at).toLocaleDateString()}</small></div><div class="row"><button class="btn-ver" onclick="window.open('${url}','_blank')">Ver</button><button class="btn-down" onclick="window.open('${url}','_blank')">Descargar</button><button class="btn-x" onclick="borrar('${t.path}')">X</button></div></div>`;
  }).join('');
 }
}
async function borrar(p){ if(!confirm('¿Borrar?')) return; await sb.storage.from(BUCKET).remove([p]); cargar(); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
</script>
</body>
</html>
