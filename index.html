<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Archivos - Starmarc-Ops</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0f1221] text-white min-h-screen p-4">
<!-- LOGIN -->
<div id="authScreen" class="max-w-sm mx-auto mt-20">
  <h1 class="text-3xl font-extrabold text-center">Starmarc-Ops</h1>
  <input id="email" type="email" placeholder="Correo" class="w-full mt-6 p-3 rounded-xl bg-[#1e2340] outline-none">
  <input id="pass" type="password" placeholder="Contraseña 6+ caracteres" class="w-full mt-3 p-3 rounded-xl bg-[#1e2340] outline-none">
  <p id="msg" class="text-sm text-white/60 mt-2 text-center"></p>
  <button id="btnLogin" class="w-full mt-4 bg-[#1a73e8] py-3 rounded-full font-bold">Entrar / Registrar</button>
  <button id="btnGoogle" class="w-full mt-3 bg-white text-black py-3 rounded-full font-bold">Continuar con Google</button>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
  <div class="flex justify-between items-center">
    <div>
      <h2 id="folderTitle" class="text-[26px] font-extrabold">Mis Archivos</h2>
      <p id="storageText" class="text-xs text-white/50">0 GB de 10 GB</p>
      <div class="w-32 h-1 bg-white/10 rounded-full mt-1"><div id="storageBar" class="h-1 bg-[#1a73e8] rounded-full" style="width:0%"></div></div>
    </div>
    <div class="flex gap-2">
      <button onclick="document.getElementById('fileInput').click()" class="bg-[#1a73e8] w-11 h-11 rounded-full text-2xl">+</button>
      <button id="btnLogout" class="bg-white/10 w-11 h-11 rounded-full">↪</button>
    </div>
  </div>

  <input type="file" id="fileInput" hidden multiple>
  <p id="uploadStatus" class="text-xs text-white/50 mt-3">Tus archivos privados</p>
  <input id="searchInput" placeholder="🔍 Buscar en mis archivos..." class="w-full mt-3 p-3 rounded-full bg-[#1e2340] outline-none">
  
  <div class="flex gap-2 mt-4">
    <button onclick="currentFolder='all';renderFiles()" class="bg-white/10 px-4 py-2 rounded-full text-xs">Todo</button>
    <button onclick="currentFolder='images';renderFiles()" class="bg-white/10 px-4 py-2 rounded-full text-xs">Imágenes</button>
    <button onclick="currentFolder='videos';renderFiles()" class="bg-white/10 px-4 py-2 rounded-full text-xs">Videos</button>
    <button onclick="currentFolder='docs';renderFiles()" class="bg-white/10 px-4 py-2 rounded-full text-xs">Docs</button>
  </div>

  <div id="filesGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-6"></div>
</div>

<script>
const SUPABASE_URL = 'TU_SUPABASE_URL';
const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'archivos';
const MASTER_EMAIL = 'TU_CORREO_PRINCIPAL@gmail.com';
const LIMIT_BYTES = 10 * 1024 * 1024 * 1024;

let currentUser = null;
let allFiles = [];
let currentFolder = 'all';
let isRegisterMode = false;

// LOGIN
document.getElementById('btnLogin').onclick=async()=>{
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  const msg=document.getElementById('msg');
  if(!email||pass.length<6){msg.innerText='Correo y 6+ caracteres';return;}
  msg.innerText=isRegisterMode?'Registrando...':'Entrando...';
  if(isRegisterMode){
    const {error}=await supabase.auth.signUp({email,password:pass});
    if(error){msg.innerText=error.message;return;}
  }
  const {data,error}=await supabase.auth.signInWithPassword({email,password:pass});
  if(error){msg.innerText=error.message;return;}
  const {data:u}=await supabase.auth.getUser();
  showApp(u.user);
};
document.getElementById('btnGoogle').onclick=async()=>{await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});};
document.getElementById('btnLogout').onclick=async()=>{await supabase.auth.signOut();location.reload();};

function showApp(user){
  currentUser=user;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  loadFiles();
}

// SUBIDA PRIVADA
document.getElementById('fileInput').onchange=async(e)=>{
  const files=e.target.files;
  if(!files.length||!currentUser)return;
  const status=document.getElementById('uploadStatus');
  let totalUsed=allFiles.reduce((a,b)=>a+(b.raw_size||0),0);
  for(const file of files){
    if(currentUser.email.toLowerCase()!==MASTER_EMAIL && (totalUsed+file.size)>LIMIT_BYTES){alert('Límite 10GB');break;}
    status.innerText='Subiendo '+file.name+'...';
    const safeName=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=currentUser.id+'/'+safeName;
    const {error}=await supabase.storage.from(BUCKET).upload(path,file);
    if(error){status.innerText='Error: '+error.message;continue;}
    totalUsed+=file.size;
  }
  loadFiles();
  status.innerText='Tus archivos privados';
};

function getFolderType(f){
  const n=f.name.toLowerCase();
  if(/\.(png|jpg|jpeg|webp|gif)$/.test(n)||(f.type&&f.type.includes('image')))return'images';
  if(/\.(mp4|mov|avi|mkv)$/.test(n)||(f.type&&f.type.includes('video')))return'videos';
  if(/\.(pdf|doc|docx|xls|ppt|txt)$/.test(n))return'docs';
  return'all';
}

// ARCHIVO CORREGIDO - SIN DUPLICADO
async function loadFiles(){
  if(!currentUser)return;
  const grid=document.getElementById('filesGrid');
  grid.innerHTML='<p class="text-white/40 text-center col-span-3 py-10">Cargando tus archivos privados...</p>';
  let list, error;
  if(currentUser.email.toLowerCase()===MASTER_EMAIL){
    const {data:d1,error:e1}=await supabase.storage.from(BUCKET).list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});
    const {data:d2}=await supabase.storage.from(BUCKET).list(currentUser.id,{limit:100,sortBy:{column:'created_at',order:'desc'}});
    let combined=[];
    if(d1) combined=combined.concat(d1.filter(f=>f.name!=='.emptyFolderPlaceholder' && f.id).map(f=>({...f,fullPath:f.name})));
    if(d2) combined=combined.concat(d2.filter(f=>f.name!=='.emptyFolderPlaceholder').map(f=>({...f,fullPath:currentUser.id+'/'+f.name})));
    list=combined; error=e1;
  }else{
    const {data,error:err}=await supabase.storage.from(BUCKET).list(currentUser.id,{limit:100,sortBy:{column:'created_at',order:'desc'}});
    list=(data||[]).filter(f=>f.name!=='.emptyFolderPlaceholder').map(f=>({...f,fullPath:currentUser.id+'/'+f.name}));
    error=err;
  }
  if(error){grid.innerHTML='<p class="text-red-300">'+error.message+'</p>';return;}

  let filesWithUrl=[];
  for(const f of list){
    const {data, error:signErr}=await supabase.storage.from(BUCKET).createSignedUrl(f.fullPath, 3600);
    if(signErr || !data) continue;
    let displayName=f.name;
    if(displayName.includes('_')) displayName=displayName.split('_').slice(1).join('_');
    filesWithUrl.push({
      name:displayName,
      storage_path:f.fullPath,
      size:(f.metadata?.size?(f.metadata.size/1024/1024).toFixed(2)+' MB':''),
      raw_size:f.metadata?.size||0,
      type:f.metadata?.mimetype||'',
      url:data.signedUrl
    });
  }
  allFiles=filesWithUrl;
  renderFiles(); updateStorage();
}

// ARCHIVO CORREGIDO - CON PREVIEW DE VIDEO
function renderFiles(){
  const grid=document.getElementById('filesGrid');
  const search=document.getElementById('searchInput').value.toLowerCase();
  let filtered=allFiles;
  if(currentFolder!=='all') filtered=filtered.filter(f=>getFolderType(f)===currentFolder);
  if(search) filtered=filtered.filter(f=>f.name.toLowerCase().includes(search));
  if(!filtered.length){
    grid.innerHTML='<p class="col-span-3 text-center py-20 text-white/40">No tienes archivos aún. ¡Sube el primero!</p>';
    return;
  }
  grid.innerHTML='';
  filtered.forEach(f=>{
    const folder = getFolderType(f);
    let preview='';
    if(folder==='images'){
      preview=`<img src="${f.url}" class="h-[170px] w-full object-cover rounded-xl">`;
    }else if(folder==='videos'){
      preview=`<video src="${f.url}" class="h-[170px] w-full object-cover rounded-xl" muted preload="metadata"></video>`;
    }else{
      preview=`<div class="h-[170px] bg-white/5 rounded-xl flex items-center justify-center text-4xl">${folder==='docs'?'📄':'📁'}</div>`;
    }
    grid.innerHTML+=`<div class="card-file rounded-[20px] p-3 bg-white/5">
      <div class="overflow-hidden rounded-xl">${preview}</div>
      <p class="font-bold text-[13px] mt-3 truncate" title="${f.name}">${f.name}</p>
      <p class="text-[11px] text-white/50">${f.size}</p>
      <div class="flex gap-2 mt-3">
        <a href="${f.url}" target="_blank" class="flex-1 bg-white/10 text-center py-2 rounded-full text-xs">Ver</a>
        <a href="${f.url}" download="${f.name}" class="flex-1 bg-[#1a73e8] text-center py-2 rounded-full text-xs font-bold">Descargar</a>
        <button onclick="deleteFile('${f.storage_path}')" class="w-8 h-8 bg-red-500/20 rounded-full text-xs">X</button>
      </div>
    </div>`;
  });
}

function updateStorage(){
  const total=allFiles.reduce((a,b)=>a+(b.raw_size||0),0);
  const gb=total/1024/1024/1024;
  const lim=currentUser.email.toLowerCase()===MASTER_EMAIL?50:10;
  document.getElementById('storageText').innerText=gb.toFixed(3)+' GB de '+lim+' GB';
  document.getElementById('storageBar').style.width=Math.min((gb/lim)*100,100)+'%';
}

window.deleteFile=async(path)=>{
  if(!confirm('¿Borrar este archivo?'))return;
  await supabase.storage.from(BUCKET).remove([path]);
  loadFiles();
};

document.getElementById('searchInput').addEventListener('input', renderFiles);

(async()=>{
  const {data}=await supabase.auth.getSession();
  if(data.session){
    const {data:u}=await supabase.auth.getUser();
    if(u.user) showApp(u.user);
  }
})();
</script>
</body>
</html>
