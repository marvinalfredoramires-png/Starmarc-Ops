<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Mis Archivos - Starmars Cloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body{background:#0a102a;color:#fff;font-family:system-ui}
  .glass{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(12px)}
  .card-dark{background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.12);border-radius:28px;overflow:hidden}
  .folder{padding:14px 16px;border-radius:16px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.2s}
  .folder:hover{background:rgba(255,255,255,0.08)}
  .folder.active{background:#fff;color:#0a102a;font-weight:800}
  #sidebar{transform:translateX(-100%);transition:.3s}
  #sidebar.open{transform:translateX(0)}
  @media(min-width:768px){#sidebar{transform:translateX(0)}}
</style>
</head>
<body class="min-h-screen">

<!-- LOGIN - MISMA LOGICA, DISEÑO AZUL -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass rounded-[24px] p-8 w-full max-w-[400px] text-center">
    <div class="text-5xl mb-3">☁️</div>
    <h2 class="text-2xl font-black">Mis Archivos</h2>
    <p class="text-white/60 text-sm mb-6">Starmars Cloud - Búnker Privado</p>
    <input id="email" type="email" placeholder="correo electronico" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none mb-3">
    <input id="pass" type="password" placeholder="contraseña" class="w-full p-3 rounded-xl bg-white/10 border border-white/10 outline-none">
    <button class="w-full bg-[#1a6cff] text-white p-3 rounded-xl mt-4 font-bold" onclick="loginEmail()">Iniciar Sesión</button>
    <div class="flex gap-2 mt-3">
      <button class="flex-1 glass py-2 rounded-xl text-sm" onclick="loginGoogle()">Google</button>
      <button class="flex-1 glass py-2 rounded-xl text-sm" onclick="loginFacebook()">Facebook</button>
    </div>
    <p id="msg" class="mt-4 text-red-400 text-sm"></p>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="hidden min-h-screen">
  <!-- HEADER AZUL OSCURO COMO TU FOTO 2 -->
  <header class="sticky top-0 z-20 bg-[#0a102a] border-b border-white/10 px-4 py-4 flex items-center justify-between">
    <button id="btnMenu" class="w-12 h-12 rounded-full glass flex items-center justify-center"><i class="fa-solid fa-bars"></i></button>
    <h1 class="font-black text-xl">☁️ Mis Archivos</h1>
    <button id="btnUploadPlus" class="w-12 h-12 rounded-full bg-[#1a6cff] flex items-center justify-center text-2xl font-bold">+</button>
  </header>

  <div class="flex">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static z-30 top-0 left-0 w-[85%] md:w-[280px] h-full md:h-auto bg-[#0a102a] md:bg-transparent p-4 pt-[88px] md:pt-4">
      <div class="bg-white text-black md:bg-transparent md:text-white rounded-[24px] p-3 md:p-0">
        <h3 class="font-black px-4 py-3 hidden md:block">☁️ Starmars Cloud</h3>
        <div class="folder active" onclick="cambiarCarpeta('',this)">📂 Todo</div>
        <div class="folder" onclick="cambiarCarpeta('imagenes',this)">🖼️ Imágenes</div>
        <div class="folder" onclick="cambiarCarpeta('videos',this)">🎬 Videos</div>
        <div class="folder" onclick="cambiarCarpeta('documentos',this)">📄 Documentos</div>
        <div class="mt-10">
          <input type="file" id="fileInput" class="hidden">
          <button onclick="logout()" class="w-full bg-black/10 md:glass py-3 rounded-2xl">Salir</button>
        </div>
      </div>
    </aside>
    <div id="overlay" class="hidden fixed inset-0 bg-black/60 z-20 md:hidden"></div>

    <!-- MAIN -->
    <main id="main" class="flex-1 p-4 md:p-6">
      <div class="flex justify-between items-center">
        <h2 id="titulo" class="text-3xl font-black">Todo</h2>
        <span class="text-white/50 text-sm" id="count"></span>
      </div>
      
      <!-- CARPETAS VISUALES -->
      <div class="flex gap-3 mt-6 overflow-x-auto pb-2">
        <div class="glass min-w-[110px] h-[90px] rounded-2xl flex flex-col items-center justify-center gap-2"><span class="text-3xl">📁</span><span class="text-xs font-bold">Bodas</span></div>
        <div class="glass min-w-[110px] h-[90px] rounded-2xl flex flex-col items-center justify-center gap-2"><span class="text-3xl">📁</span><span class="text-xs font-bold">XV Años</span></div>
        <div class="glass min-w-[110px] h-[90px] rounded-2xl flex flex-col items-center justify-center gap-2"><span class="text-3xl">📁</span><span class="text-xs font-bold">Clientes</span></div>
      </div>

      <div id="lista" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">Cargando búnker privado...</div>
    </main>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cdffffghheikcmstcmcl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY";
const BUCKET = "archivos";
const SITE_URL = "https://marvinalfredoramires-png.github.io/Starmarc-Ops/";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let uidActual = null;
let carpetaActual = "";

document.getElementById('btnMenu').onclick = ()=>{ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.remove('hidden'); }
document.getElementById('overlay').onclick = ()=>{ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.add('hidden'); }
document.getElementById('btnUploadPlus').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = ()=> subir();

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) mostrarApp(session.user);
})();

async function loginEmail(){
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('pass').value;
  if(!emailVal || !passVal) return document.getElementById('msg').innerText = "Pon correo y contraseña";
  const { data, error } = await sb.auth.signInWithPassword({ email: emailVal, password: passVal });
  if(error) return document.getElementById('msg').innerText = error.message;
  mostrarApp(data.user);
}
async function loginGoogle(){ await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: SITE_URL } }); }
async function loginFacebook(){ await sb.auth.signInWithOAuth({ provider:'facebook', options:{ redirectTo: SITE_URL } }); }

function mostrarApp(user){
  uidActual = user.id;
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  cargarArchivos();
}

function cambiarCarpeta(c, el){
  carpetaActual = c;
  document.querySelectorAll('.folder').forEach(f=>f.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('titulo').innerText = c ? c.charAt(0).toUpperCase()+c.slice(1) : 'Todo';
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.add('hidden');
  cargarArchivos();
}

async function cargarArchivos(){
  const lista = document.getElementById('lista');
  if(!uidActual) return;
  lista.innerHTML = "Cargando búnker privado...";
  let todos = [];
  const buscar = carpetaActual ? [carpetaActual] : ['imagenes','videos','documentos',''];
  for(const sub of buscar){
    const prefijo = sub ? `${uidActual}/${sub}` : `${uidActual}`;
    const { data } = await sb.storage.from(BUCKET).list(prefijo, { limit: 200, sortBy:{ column:'created_at', order:'desc' } });
    if(data){
      const filtrados = data.filter(f => f.name !== ".emptyFolderPlaceholder");
      for(const f of filtrados){
        if(f.metadata === null && f.id === null) continue;
        todos.push({ ...f, _carpeta: sub || 'general', _prefijo: prefijo });
      }
    }
  }
  if(!todos.length){ lista.innerHTML = "<div class='glass rounded-2xl p-10 text-center text-white/50'>Búnker vacío. Dale al + para subir tu primer archivo.</div>"; return; }
  document.getElementById('count').innerText = todos.length + " archivos";
  lista.innerHTML = "";
  for(const f of todos){
    const fullPath = f._prefijo === uidActual ? `${uidActual}/${f.name}` : `${uidActual}/${f._carpeta}/${f.name}`;
    const { data:signed } = await sb.storage.from(BUCKET).createSignedUrl(fullPath, 3600);
    if(!signed) continue;
    let nombreReal = f.name;
    if(nombreReal.includes("-")){
      const sinTime = nombreReal.substring(nombreReal.indexOf("-")+1);
      if(sinTime.length > 2) nombreReal = sinTime;
    }
    const isVideo = f.name.toLowerCase().match(/\.(mp4|mov|webm|m4v)$/);
    lista.innerHTML += `
      <div class="card-dark p-3">
        <div class="bg-[#1c244a] rounded-[20px] h-[190px] flex items-center justify-center overflow-hidden">
          ${isVideo ? `<video src="${signed.signedUrl}" preload="metadata" controls playsinline muted class="w-full h-full object-cover"></video>` : `<img src="${signed.signedUrl}" loading="lazy" class="w-full h-full object-cover">`}
        </div>
        <div class="p-2">
          <div class="name text-white font-bold truncate text-[14px]" title="${nombreReal}">${nombreReal}</div>
          <small class="text-white/50">${f._carpeta} • ${(f.metadata?.size/1024/1024).toFixed(2) || '2.90'} MB</small>
          <div class="flex gap-2 mt-3">
            <a href="${signed.signedUrl}" target="_blank" class="flex-1 glass py-2 rounded-full text-center text-sm">Ver</a>
            <a href="${signed.signedUrl}" download class="flex-1 bg-[#1a6cff] py-2 rounded-full text-center text-sm font-bold">Descargar</a>
          </div>
        </div>
      </div>`;
  }
}

async function subir(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  let sub = "documentos";
  if(['jpg','jpeg','png','webp','heic','gif'].includes(ext)) sub = "imagenes";
  if(['mp4','mov','webm','m4v','avi'].includes(ext)) sub = "videos";
  const path = `${uidActual}/${sub}/${Date.now()}-${file.name}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file);
  if(error) return alert(error.message);
  input.value = "";
  cambiarCarpeta(sub, document.querySelectorAll('.folder')[sub==='imagenes'?1:sub==='videos'?2:3]);
}

async function logout(){ await sb.auth.signOut(); location.reload(); }
</script>
</body>
</html>
