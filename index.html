<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starmarc Cloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a1220;color:white;overflow-x:hidden}
.glass{background:rgba(19,38,71,0.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08)}
.card{background:rgba(21,44,81,0.7);border:1px solid rgba(255,255,255,0.08)}
.sidebar-bg{background:#080e1c}
.btn-blue{background:#0ea5e9}
@media(max-width:768px){.sidebar{transform:translateX(-100%);position:fixed;z-index:50;left:0;top:0;height:100vh;width:260px;transition:.3s}.sidebar.open{transform:translateX(0)}.grid-cards{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4" style="background:radial-gradient(800px at 30% -20%,#122a4f 0%,#0a1220 60%)">
<div class="glass p-8 rounded-[24px] w-full max-w-sm text-center">
<div class="w-14 h-14 bg-white text-black rounded-2xl flex items-center justify-center mx-auto font-black">S</div>
<h1 class="text-xl font-bold mt-4">Starmarc Cloud</h1>
<input id="email" value="starmarc.estudio@gmail.com" class="w-full mt-6 bg-[#0a1220] border border-white/10 rounded-xl p-3 text-sm">
<input id="password" type="password" class="w-full mt-3 bg-[#0a1220] border border-white/10 rounded-xl p-3 text-sm" placeholder="Password">
<button onclick="login()" class="w-full mt-4 bg-white text-black font-bold rounded-xl p-3">ENTRAR</button>
<p id="loginError" class="text-red-400 text-xs mt-3 hidden"></p>
</div>
</div>
<div id="appScreen" class="hidden min-h-screen flex">
<aside id="sidebar" class="sidebar sidebar-bg w-[250px] p-4 flex flex-col justify-between">
<div>
<div class="flex items-center gap-3 mb-6"><div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center font-bold text-sm">SA</div><div><p class="text-xs font-bold">Starmarc Admin</p><p class="text-[10px] text-slate-400">68mm@starmarc.com</p></div></div>
<button onclick="createFolder()" class="w-full glass rounded-xl p-3 text-sm flex items-center gap-2"><i class="fa fa-folder-plus text-sky-400"></i> Nueva Carpeta</button>
<nav class="mt-6 space-y-1 text-[13px]">
<a onclick="navigateTo('')" class="flex items-center gap-3 p-2.5 rounded-xl bg-white/10 cursor-pointer"><i class="fa fa-folder w-5 text-sky-400"></i> Mis Archivos</a>
<a class="flex items-center gap-3 p-2.5 rounded-xl text-slate-400"><i class="fa fa-file-lines w-5"></i> Documentos</a>
<a class="flex items-center gap-3 p-2.5 rounded-xl text-slate-400"><i class="fa fa-trash w-5"></i> Papelera</a>
</nav>
<div id="folderList" class="mt-6 space-y-1"></div>
</div>
<div class="glass rounded-2xl p-3 mt-4">
<p class="text-[10px] text-slate-400">ALMACENAMIENTO</p>
<p id="storageText" class="text-sm font-bold mt-1 text-sky-300">0 MB / 1 GB</p>
<div class="h-1.5 bg-white/10 rounded-full mt-2"><div id="storageBar" class="h-full bg-sky-400" style="width:2%"></div></div>
</div>
</aside>
<div class="flex-1 min-w-0" style="background:radial-gradient(900px at 20% 0%,#132e5a 0%,#0a1220 70%)">
<header class="p-4 md:p-6 flex items-center justify-between gap-3">
<div class="flex items-center gap-3 flex-1">
<button onclick="toggleMenu()" class="md:hidden w-9 h-9 glass rounded-xl flex items-center justify-center"><i class="fa fa-bars"></i></button>
<div class="relative flex-1 max-w-[320px]"><i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i><input id="searchInput" oninput="filterFiles()" placeholder="Buscar en Starmarc Cloud..." class="w-full bg-[#0e1b32] border border-white/10 rounded-full pl-9 pr-4 py-2.5 text-[13px] outline-none"></div>
</div>
<div class="flex items-center gap-2">
<button onclick="document.getElementById('fileInput').click()" class="bg-sky-500 text-white text-[13px] font-bold px-5 py-2.5 rounded-full"><i class="fa fa-cloud-arrow-up mr-1"></i> Subir archivo</button>
<button onclick="logout()" class="w-9 h-9 glass rounded-full flex items-center justify-center"><i class="fa fa-sign-out text-xs"></i></button>
<input type="file" id="fileInput" multiple class="hidden" onchange="uploadFiles(this.files)">
</div>
</header>
<div class="px-4 md:px-6 pb-6">
<h1 class="text-[22px] font-bold">Mis Archivos</h1>
<p class="text-[12px] text-slate-400 mb-6">Arrastra tus archivos o utiliza el botón para subirlos dinámicamente <span id="pathDisplay" class="text-sky-300"></span></p>
<div id="breadcrumb" class="flex items-center gap-2 text-xs text-slate-400 mb-4"></div>
<div id="fileGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 grid-cards"></div>
</div>
</div>
</div>
<div id="overlay" onclick="toggleMenu()" class="hidden fixed inset-0 bg-black/60 z-40 md:hidden"></div>
<script>
const SUPABASE_URL="https://obvfncbwubmybcpisgqz.supabase.co";
const SUPABASE_KEY="sb_publishable_otcfh8jx0UppsEePiD3egw_BE_P7vRF";
const BUCKET="starmarc-cloud";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentPath="";
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('hidden')}
function navigateTo(path){currentPath=path;toggleMenu();loadFiles();}
async function login(){const email=document.getElementById('email').value;const pw=document.getElementById('password').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){document.getElementById('loginError').textContent=error.message;document.getElementById('loginError').classList.remove('hidden');return;}document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');loadFiles();}
async function logout(){await supabaseClient.auth.signOut();location.reload();}
async function loadFiles(){const {data,error}=await supabaseClient.storage.from(BUCKET).list(currentPath,{limit:100});const grid=document.getElementById('fileGrid');if(error){grid.innerHTML=`<p class='text-red-300 text-sm'>${error.message}</p>`;return;}document.getElementById('pathDisplay').textContent=currentPath?` / ${currentPath}`:"";let total=0;data.forEach(f=>{if(f.metadata?.size) total+=f.metadata.size});document.getElementById('storageText').textContent=`${(total/1024/1024).toFixed(1)} MB / 1 GB`;grid.innerHTML=data.map(f=>{const isFolder=f.metadata==null;if(isFolder){return `<div onclick="navigateTo('${currentPath?currentPath+'/':''}${f.name}')" class='card rounded-[18px] p-4 cursor-pointer flex items-center gap-3'><div class='w-12 h-12 bg-amber-400/20 rounded-xl flex items-center justify-center'><i class='fa fa-folder text-amber-400'></i></div><div><p class='text-sm font-bold'>${f.name}</p><p class='text-[11px] text-slate-400'>Carpeta</p></div></div>`}const name=f.name;return `<div class='card rounded-[18px] p-3'><div class='h-[70px] flex items-center justify-center'><i class='fa fa-file text-2xl'></i></div><p class='text-[13px] font-bold truncate mt-2'>${name}</p><div class='flex gap-1 mt-3'><a href='${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${currentPath?currentPath+'/':''}${name}' target='_blank' class='flex-1 bg-white/10 rounded-full py-1.5 text-[11px] text-center'>Ver</a><button onclick="deleteFile('${name}')" class='w-8 h-8 bg-white/5 rounded-full'><i class='fa fa-trash text-[10px]'></i></button></div></div>`}).join('');}
async function createFolder(){const name=prompt('Nombre de la carpeta:');if(!name) return;const path=currentPath?`${currentPath}/${name}/.keep`:`${name}/.keep`;const {error}=await supabaseClient.storage.from(BUCKET).upload(path,new Blob(['']));if(error) alert(error.message);else loadFiles();}
async function uploadFiles(files){for(let file of files){const path=currentPath?`${currentPath}/${file.name}`:file.name;await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:true});}loadFiles();}
async function deleteFile(name){if(!confirm("¿Borrar "+name+"?")) return;const path=currentPath?`${currentPath}/${name}`:name;await supabaseClient.storage.from(BUCKET).remove([path]);loadFiles();}
supabaseClient.auth.getSession().then(({data})=>{if(data.session){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');loadFiles();}});
function filterFiles(){const q=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('#fileGrid > div').forEach(d=>{d.style.display=d.innerText.toLowerCase().includes(q)?'':'none';});}
</script>
</body>
</html>
