<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starmarc Cloud - Black Edition</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#00d4ff;--purple:#8b5cf6;--card:#0a0a14;--border:rgba(139,92,246,.28)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#000;color:#fff;display:flex;min-height:100vh}
.sidebar{width:270px;background:linear-gradient(180deg,#050510 0%,#000 100%);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column}
.logo{font-size:21px;font-weight:900;margin-bottom:36px} .logo b{background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav a{display:flex;gap:12px;padding:12px;border-radius:12px;color:#7a7da0;text-decoration:none;margin-bottom:6px}
.nav a.active{background:rgba(139,92,246,.15);color:#fff;border:1px solid rgba(139,92,246,.35);box-shadow:0 0 22px rgba(139,92,246,.35)}
.main{flex:1;padding:22px;overflow:auto}
.topbar{display:flex;gap:14px;margin-bottom:22px}
.search{flex:1;background:#0a0a14;border:1px solid var(--border);border-radius:14px;padding:13px 18px;display:flex;gap:10px;align-items:center}
.search input{background:transparent;border:none;color:#fff;width:100%;outline:none}
.btn{background:linear-gradient(90deg,var(--blue),var(--purple));border:none;color:#fff;font-weight:800;padding:12px 22px;border-radius:12px;cursor:pointer;box-shadow:0 0 28px rgba(139,92,246,.6)}
.stats{display:grid;grid-template-columns:340px 1fr 1fr;gap:18px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.orb{width:128px;height:128px;margin:0 auto 14px;background:radial-gradient(circle at 30% 30%,var(--blue),var(--purple),#000);border-radius:50%;box-shadow:0 0 45px rgba(139,92,246,.7);display:grid;place-items:center;font-size:44px;animation:float 4s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.file{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;transition:.22s}
.file:hover{border-color:var(--purple);box-shadow:0 0 26px rgba(139,92,246,.35);transform:translateY(-3px)}
.thumb{height:108px;background:#111122;border-radius:10px;display:grid;place-items:center;font-size:42px;margin-bottom:10px}
.badge{display:inline-block;margin-top:6px;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.32);color:#a78bfa;padding:4px 10px;border-radius:20px;font-size:11px}
.bar{height:6px;background:#1a1a2e;border-radius:10px;overflow:hidden;margin-top:10px} .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo">✦ <b>Starmarc Cloud</b></div>
<nav class="nav"><a class="active">📁 My Drive</a><a>🔗 Shared</a><a>🕒 Recent</a><a>🗑️ Trash</a></nav>
<div style="margin-top:auto;background:#0a0a14;padding:16px;border-radius:14px;border:1px solid var(--border)">
<div style="font-size:11px;color:#8b8da3">ALMACENAMIENTO</div>
<div id="storageText" style="font-weight:900;margin:6px 0">0 MB / 10GB</div>
<div class="bar"><div id="storageFill" class="fill" style="width:0%"></div></div>
<div id="adminBadge" style="display:none;margin-top:8px" class="badge">👑 Admin Ilimitado</div>
</div>
</div>
<div class="main">
<div class="topbar">
<div class="search">✨ <input id="q" placeholder="AI Search..."/></div>
<button class="btn" id="upBtn">⬆ Subir archivo</button>
<input type="file" id="fileInput" hidden multiple />
</div>
<div class="stats">
<div class="card" style="text-align:center"><div class="orb">🌌</div><div id="orbText" style="font-size:22px;font-weight:900;background:linear-gradient(90deg,#00d4ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">0 MB / 10GB</div><div style="font-size:12px;color:#8b8da3">Usado • 0% de 10GB</div></div>
<div class="card"><div style="color:#8b8da3">Archivos</div><div id="count" style="font-size:34px;font-weight:900;margin:10px 0">0 Files</div><div style="color:#00d4ff">R2 Conectado ✅</div></div>
<div class="card"><div style="color:#8b8da3">AI</div><div style="font-size:34px;font-weight:900;margin:10px 0">Auto</div><div style="color:#00d4ff">Organizado por IA</div></div>
</div>
<h2 style="margin-bottom:14px">Your Files</h2>
<div id="grid" class="grid"></div>
<div id="empty" style="text-align:center;padding:60px;color:#666">Tu nube está vacía<br>Sube archivos y se guardan en tu R2 privado</div>
<div id="status" style="margin-top:16px;font-size:13px;color:#8b8da3"></div>
</div>
<script>
const SUPABASE_URL = "https://cdffffghheikcmstcmcl.supabase.co";
const SUPABASE_KEY = "sb_publishable_otcfh8jx0UppsEePiD3egw_BE_P7vRF";
const BUCKET = "starmarc-cloud";
const MAX = 10 * 1024 * 1024 * 1024;
const ADMIN = "starmarc.estudio@gmail.com";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let used = 0, userEmail = "";
async function init(){
 const {data:{user}} = await sb.auth.getUser();
 if(!user){ document.getElementById('status').innerText = "No has iniciado sesión. Ve a login.html"; return; }
 userEmail = user.email;
 if(userEmail === ADMIN) document.getElementById('adminBadge').style.display='inline-block';
 await refresh();
}
async function refresh(){
 const {data, error} = await sb.storage.from(BUCKET).list(userEmail, {limit:100, sortBy:{column:'created_at', order:'desc'}});
 if(error){ document.getElementById('status').innerText = "Error: "+error.message; return; }
 const grid = document.getElementById('grid'); grid.innerHTML="";
 used = 0;
 data.forEach(f=>{ used += f.metadata?.size || 0; });
 updateBar();
 let count = data.length;
 document.getElementById('count').innerText = count+" Files";
 document.getElementById('empty').style.display = count ? 'none' : 'block';
 data.forEach(f=> addCard(f));
 document.getElementById('status').innerText = "✅ "+count+" archivos | "+(used/1024/1024).toFixed(2)+" MB usados";
}
function updateBar(){
 const mb = (used/1024/1024).toFixed(1);
 const pct = Math.min((used/MAX)*100,100);
 const txt = userEmail===ADMIN ? mb+" MB / Ilimitado 👑" : mb+" MB / 10GB";
 document.getElementById('storageText').innerText = txt;
 document.getElementById('orbText').innerText = txt;
 document.getElementById('storageFill').style.width = userEmail===ADMIN ? '85%' : pct+'%';
}
function addCard(f){
 const ext = f.name.split('.').pop().toLowerCase();
 let icon="📄"; if(['png','jpg','jpeg','webp'].includes(ext)) icon="🖼️"; if(['pdf'].includes(ext)) icon="📕"; if(['mp4','mov'].includes(ext)) icon="🎬";
 const div = document.createElement('div'); div.className='file';
 const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${userEmail}/${f.name}`;
 const size = (f.metadata?.size/1024/1024||0).toFixed(2);
 div.innerHTML = `<div class="thumb">${icon}</div><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div><div style="font-size:12px;color:#8b8da3">${size} MB</div><span class="badge">R2: ${ext.toUpperCase()}</span><div style="margin-top:10px;display:flex;gap:12px"><a href="${fileUrl}" target="_blank" style="color:#00d4ff;font-size:12px;text-decoration:none;font-weight:700">VER</a><a href="${fileUrl}" download style="color:#8b5cf6;font-size:12px;text-decoration:none;font-weight:700">DESCARGAR</a></div>`;
 document.getElementById('grid').appendChild(div);
}
document.getElementById('upBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = async (e)=>{
 for(let file of e.target.files){
   if(used + file.size > MAX && userEmail !== ADMIN){ alert('Limite 10GB alcanzado'); return; }
   document.getElementById('status').innerText = "Subiendo "+file.name+" a R2...";
   const path = `${userEmail}/${Date.now()}_${file.name}`;
   const {error} = await sb.storage.from(BUCKET).upload(path, file);
   if(error){ alert('Error: '+error.message); } else { await refresh(); }
 }
};
document.getElementById('q').addEventListener('input', (e)=>{
 const term = e.target.value.toLowerCase();
 document.querySelectorAll('.file').forEach(c=>{ c.style.display = c.innerText.toLowerCase().includes(term) ? 'block' : 'none'; });
});
init();
</script>
</body>
</html>
