<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starmarc Ops</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0d0d;--card:#171717;--border:#262626}
body{margin:0;font-family:system-ui;background:var(--bg);color:#fff;padding:16px}
.login{max-width:380px;margin:60px auto;background:var(--card);padding:24px;border-radius:16px;border:1px solid var(--border)}
.login input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid var(--border);background:#0f0f0f;color:#fff;box-sizing:border-box}
.login button{width:100%;padding:12px;background:#fff;color:#000;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}
.login button.sec{background:#222;color:#fff;border:1px solid #333;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center}
.folders{display:flex;gap:8px;margin:16px 0;overflow:auto}
.folders button{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#1e1e1e;color:#fff;cursor:pointer;white-space:nowrap}
.folders button.active{background:#fff;color:#000}
.grid{display:grid;gap:12px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);padding:12px;border-radius:12px}
.card img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#222}
.thumb{width:56px;height:56px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px}
.name{font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11px;color:#888}
a.open{margin-left:auto;color:#fff;text-decoration:none;background:#2a2a2a;padding:6px 12px;border-radius:8px;font-size:12px}
#app{display:none}
</style>
</head>
<body>

<div id="loginBox" class="login">
<h2>Starmarc Cloud</h2>
<p style="font-size:13px;color:#aaa">Entra o crea tu cuenta para ver tus archivos</p>
<input id="email" type="email" placeholder="Tu email">
<input id="pass" type="password" placeholder="Contraseña (mín 6 letras)">
<button onclick="login()">Entrar</button>
<button class="sec" onclick="registrar()">Crear cuenta nueva</button>
<div id="msg" style="margin-top:10px;color:#ff6b6b;font-size:13px"></div>
</div>

<div id="app">
<div class="top"><h3>Mis Archivos</h3><button onclick="logout()" style="background:#222;color:#fff;border:1px solid #333;padding:6px 12px;border-radius:8px">Salir</button></div>
<div class="folders">
<button class="active" onclick="filtrar('todo',this)">Todo</button>
<button onclick="filtrar('imagen',this)">Imágenes</button>
<button onclick="filtrar('video',this)">Videos</button>
<button onclick="filtrar('doc',this)">Docs</button>
</div>
<div id="lista" class="grid">Cargando...</div>
</div>

<script>
const SUPABASE_URL = 'https://cdffffghheikcmstcmcl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY';
const BUCKET = 'archivos';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let todos = [];

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){ document.getElementById('loginBox').style.display='none'; document.getElementById('app').style.display='block'; cargar(); }
}
checkSession();

async function login(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value.trim();
  if(!email || !pass){ document.getElementById('msg').innerText='Pon email y contraseña'; return; }
  document.getElementById('msg').innerText='Entrando...';
  const { error } = await sb.auth.signInWithPassword({email, password: pass});
  if(error){ document.getElementById('msg').innerText='Error: '+error.message; }
  else { document.getElementById('loginBox').style.display='none'; document.getElementById('app').style.display='block'; cargar(); }
}

async function registrar(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value.trim();
  if(!email || !pass){ document.getElementById('msg').innerText='Pon email y contraseña'; return; }
  if(pass.length < 6){ document.getElementById('msg').innerText='La contraseña debe tener mínimo 6 caracteres'; return; }
  document.getElementById('msg').innerText='Creando cuenta...';
  const { data, error } = await sb.auth.signUp({email, password: pass});
  if(error){ document.getElementById('msg').innerText='Error: '+error.message; }
  else { 
    document.getElementById('msg').style.color='#4ade80';
    document.getElementById('msg').innerText='¡Cuenta creada! Entrando...';
    setTimeout(async()=>{
      await sb.auth.signInWithPassword({email, password: pass});
      document.getElementById('loginBox').style.display='none';
      document.getElementById('app').style.display='block';
      cargar();
    }, 800);
  }
}

async function logout(){ await sb.auth.signOut(); location.reload(); }

async function cargar(){
  const { data:{user} } = await sb.auth.getUser();
  if(!user) return;
  const { data, error } = await sb.storage.from(BUCKET).list(user.id, {limit:100, sortBy:{column:'created_at', order:'desc'}});
  if(error){ document.getElementById('lista').innerHTML = error.message; return; }
  todos = data || [];
  pintar(todos);
}

function getPublicUrl(fileName, userId){ return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${userId}/${fileName}`; }

function pintar(files){
  const lista = document.getElementById('lista');
  if(files.length===0){ lista.innerHTML='No hay archivos aún. Cada usuario ve solo sus archivos.'; return; }
  sb.auth.getUser().then(({data})=>{
    const uid = data.user?.id;
    lista.innerHTML = files.map(f=>{
      const nombreReal = f.metadata?.originalName || f.name.split('_').slice(1).join('_') || f.name;
      const ext = f.name.split('.').pop().toLowerCase();
      const isImg = ['jpg','jpeg','png','webp','gif'].includes(ext);
      const tipo = isImg ? 'imagen' : ['mp4','mov','webm','avi'].includes(ext) ? 'video' : 'doc';
      const url = getPublicUrl(f.name, uid);
      let thumb = `<div class="thumb">${isImg?'🖼️':tipo==='video'?'🎥':'📄'}</div>`;
      if(isImg) thumb = `<img src="${url}" onerror="this.outerHTML='<div class=thumb>🖼️</div>'">`;
      return `<div class="card" data-tipo="${tipo}">${thumb}<div><div class="name" title="${nombreReal}">${nombreReal}</div><div class="meta">${new Date(f.created_at).toLocaleDateString()}</div></div><a class="open" href="${url}" target="_blank">Abrir</a></div>`;
    }).join('');
  });
}

function filtrar(tipo, btn){
  document.querySelectorAll('.folders button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(tipo==='todo') pintar(todos);
  else pintar(todos.filter(f=>{
    const ext = f.name.split('.').pop().toLowerCase();
    if(tipo==='imagen') return ['jpg','jpeg','png','webp','gif'].includes(ext);
    if(tipo==='video') return ['mp4','mov','webm','avi'].includes(ext);
    if(tipo==='doc') return !['jpg','jpeg','png','webp','gif','mp4','mov','webm','avi'].includes(ext);
  }));
}
</script>
</body>
</html>
