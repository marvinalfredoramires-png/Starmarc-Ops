<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Archivos - Starmars Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,Arial;background:#f4f6fb;color:#111;display:flex;min-height:100vh}
  #sidebar{width:260px;background:#ffffff;border-right:1px solid #e5e7eb;padding:22px;display:flex;flex-direction:column}
  #sidebar h3{margin-bottom:18px}
  .folder{padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:6px;display:flex;gap:8px;align-items:center}
  .folder:hover{background:#eef2ff}
  .folder.active{background:#111;color:#fff}
  #main{flex:1;padding:24px;background:#f4f6fb}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card video,.card img{width:100%;height:200px;object-fit:cover;border-radius:10px;background:#000;display:block}
  .name{font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{background:#111;color:#fff;border:0;padding:9px 14px;border-radius:9px;cursor:pointer}
  input{background:#fff;border:1px solid #ddd;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div id="sidebar">
  <h3>☁️ Starmars Cloud</h3>
  <div class="folder active" onclick="cambiarCarpeta('',this)">📂 Todo</div>
  <div class="folder" onclick="cambiarCarpeta('imagenes',this)">🖼️ Imágenes</div>
  <div class="folder" onclick="cambiarCarpeta('videos',this)">🎬 Videos</div>
  <div class="folder" onclick="cambiarCarpeta('documentos',this)">📄 Documentos</div>
  <div style="margin-top:auto;padding-top:20px">
    <button id="btnSalir" style="display:none;width:100%" onclick="logout()">Salir</button>
  </div>
</div>

<div id="main">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <h2 id="titulo">Mis Archivos</h2>
    <div>
      <input type="file" id="fileInput">
      <button onclick="subir()">Subir</button>
    </div>
  </div>
  <div id="lista" class="grid">Verificando sesión...</div>
</div>

<script>
const SUPABASE_URL = "https://cdffffghheikcmstcmcl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY";
const BUCKET = "archivos";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let uidActual = null;
let carpetaActual = "";

async function init(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){
    document.getElementById('lista').innerHTML = "No has iniciado sesión. Vuelve al login.";
    return;
  }
  uidActual = user.id;
  document.getElementById('btnSalir').style.display = "block";
  cargarArchivos();
}

function cambiarCarpeta(carpeta, el){
  carpetaActual = carpeta;
  document.querySelectorAll('.folder').forEach(f=>f.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('titulo').innerText = carpeta ? carpeta.charAt(0).toUpperCase()+carpeta.slice(1) : "Todo";
  cargarArchivos();
}

async function cargarArchivos(){
  const lista = document.getElementById('lista');
  lista.innerHTML = "Cargando búnker privado...";
  let todos = [];
  const buscar = carpetaActual ? [carpetaActual] : ['imagenes','videos','documentos'];
  
  for(const sub of buscar){
    const {data, error} = await sb.storage.from(BUCKET).list(`${uidActual}/${sub}`, {limit:200, sortBy:{column:'created_at', order:'desc'}});
    if(data) todos = todos.concat(data.filter(f=>f.name !== ".emptyFolderPlaceholder").map(f=>({...f, _carpeta:sub})));
  }

  if(!todos.length){ lista.innerHTML = "Búnker vacío"; return; }
  
  lista.innerHTML = "";
  for(const f of todos){
    const fullPath = `${uidActual}/${f._carpeta}/${f.name}`;
    const {data:signed} = await sb.storage.from(BUCKET).createSignedUrl(fullPath, 3600);
    if(!signed) continue;

    // NOMBRE REAL SIN TIMESTAMP
    let nombreReal = f.name;
    if(nombreReal.includes("-")){
      const posible = nombreReal.substring(nombreReal.indexOf("-")+1);
      if(posible.length > 3) nombreReal = posible;
    }
    const isVideo = f.name.match(/\.(mp4|mov|webm|m4v)$/i);

    lista.innerHTML += `
      <div class="card">
        ${isVideo ? `<video src="${signed.signedUrl}" preload="metadata" controls playsinline muted></video>` : `<img src="${signed.signedUrl}" loading="lazy">`}
        <div class="name" title="${nombreReal}">${nombreReal}</div>
        <small style="color:#666">${f._carpeta} • ${f.metadata?.size ? (f.metadata.size/1024/1024).toFixed(2)+' MB' : ''}</small>
        <a href="${signed.signedUrl}" target="_blank"><button style="width:100%;margin-top:8px">Ver / Descargar</button></a>
      </div>`;
  }
}

async function subir(){
  const file = document.getElementById('fileInput').files[0];
  if(!file) return alert("Elige archivo");
  const ext = file.name.split('.').pop().toLowerCase();
  let sub = "documentos";
  if(['jpg','jpeg','png','webp','heic'].includes(ext)) sub = "imagenes";
  if(['mp4','mov','webm','m4v'].includes(ext)) sub = "videos";
  
  const path = `${uidActual}/${sub}/${Date.now()}-${file.name}`;
  const {error} = await sb.storage.from(BUCKET).upload(path, file);
  if(error) return alert(error.message);
  cargarArchivos();
}

async function logout(){ await sb.auth.signOut(); location.href = "login.html"; }

init();
</script>
</body>
</html>
