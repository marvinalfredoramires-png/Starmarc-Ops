<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mis Archivos - Starmars Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,Arial;background:#f4f6fb;color:#111;min-height:100vh}
  #loginPage{max-width:400px;margin:40px auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
  #loginPage input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:15px}
  .btnPrimary{width:100%;background:#111;color:#fff;padding:13px;border:0;border-radius:10px;margin-top:8px;cursor:pointer;font-weight:600}
  .btnSocial{width:49%;background:#f8f9ff;color:#111;padding:11px;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer;font-size:13px}
  #appPage{display:none;min-height:100vh}
  .appLayout{display:flex;min-height:100vh}
  #sidebar{width:260px;background:#ffffff;border-right:1px solid #e5e7eb;padding:22px;display:flex;flex-direction:column}
  .folder{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:6px;display:flex;gap:8px;align-items:center;font-size:14px}
  .folder:hover{background:#eef2ff}
  .folder.active{background:#111;color:#fff}
  #main{flex:1;padding:24px;background:#f4f6fb}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card video,.card img{width:100%;height:200px;object-fit:cover;border-radius:10px;background:#000;display:block}
  .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
  button{cursor:pointer}
  @media(max-width:700px){ .appLayout{flex-direction:column} #sidebar{width:100%} }
</style>
</head>
<body>

<div id="loginPage">
  <div style="font-size:42px">☁️</div>
  <h2>Mis Archivos</h2>
  <p style="color:#666;font-size:14px;margin-bottom:12px">Starmars Cloud - Búnker Privado</p>
  <input id="email" type="email" placeholder="correo electronico">
  <input id="pass" type="password" placeholder="contraseña">
  <button class="btnPrimary" onclick="loginEmail()">Iniciar Sesión</button>
  <div style="display:flex;justify-content:space-between;margin-top:12px;gap:8px">
    <button class="btnSocial" onclick="loginGoogle()">Google</button>
    <button class="btnSocial" onclick="loginFacebook()">Facebook</button>
  </div>
  <p id="msg" style="margin-top:14px;color:#d00;font-size:13px"></p>
</div>

<div id="appPage">
  <div class="appLayout">
    <div id="sidebar">
      <h3>☁️ Starmars Cloud</h3><br>
      <div class="folder active" onclick="cambiarCarpeta('',this)">📂 Todo</div>
      <div class="folder" onclick="cambiarCarpeta('imagenes',this)">🖼️ Imágenes</div>
      <div class="folder" onclick="cambiarCarpeta('videos',this)">🎬 Videos</div>
      <div class="folder" onclick="cambiarCarpeta('documentos',this)">📄 Documentos</div>
      <div style="margin-top:auto;padding-top:30px">
        <button onclick="logout()" style="width:100%;background:#f1f1f1;color:#111;border:1px solid #ddd;padding:10px;border-radius:10px">Salir</button>
      </div>
    </div>
    <div id="main">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <h2 id="titulo">Todo</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="file" id="fileInput" style="background:#fff;padding:6px;border-radius:8px;border:1px solid #ddd">
          <button onclick="subir()" style="background:#111;color:#fff;padding:10px 16px;border-radius:10px;border:0">Subir</button>
        </div>
      </div>
      <div id="lista" class="grid">Cargando...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cdffffghheikcmstcmcl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZmZmZmdoaGVpa2Ntc3RjbWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4OTE1MzEsImV4cCI6MjEwODQ2NzUzMX0._UMIkvrkJHST29yyV9lBzfFxMg_8Ovi-0qd0Nk3fQrY";
const BUCKET = "archivos";
const SITE_URL = "https://marvinalfredoramires-png.github.io/Starmarc-Ops/";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let uidActual = null;
let carpetaActual = "";

// AUTO LOGIN
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) mostrarApp(session.user);
})();

async function loginEmail(){
  const emailVal = document.getElementById('email').value.trim();
  const passVal = document.getElementById('pass').value;
  if(!emailVal || !passVal) return document.getElementById('msg').innerText = "Pon correo y contraseña";
  const { data, error } = await sb.auth.signInWithPassword({ email: emailVal, password: passVal });
  if(error) return document.getElementById('msg').innerText = error.message;
  mostrarApp(data.user);
}
async function loginGoogle(){ await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: SITE_URL } }); }
async function loginFacebook(){ await sb.auth.signInWithOAuth({ provider:'facebook', options:{ redirectTo: SITE_URL } }); }

function mostrarApp(user){
  uidActual = user.id;
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  cargarArchivos();
}

function cambiarCarpeta(c, el){
  carpetaActual = c;
  document.querySelectorAll('.folder').forEach(f=>f.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('titulo').innerText = c ? c : 'Todo';
  cargarArchivos();
}

async function cargarArchivos(){
  const lista = document.getElementById('lista');
  if(!uidActual) return;
  lista.innerHTML = "Cargando búnker privado...";
  let todos = [];
  const buscar = carpetaActual ? [carpetaActual] : ['imagenes','videos','documentos',''];

  for(const sub of buscar){
    const prefijo = sub ? `${uidActual}/${sub}` : `${uidActual}`;
    const { data } = await sb.storage.from(BUCKET).list(prefijo, { limit: 200, sortBy:{ column:'created_at', order:'desc' } });
    if(data){
      const filtrados = data.filter(f => f.name !== ".emptyFolderPlaceholder");
      for(const f of filtrados){
        // Si es carpeta no la mostramos como archivo
        if(f.metadata === null && f.id === null) continue;
        todos.push({ ...f, _carpeta: sub || 'general', _prefijo: prefijo });
      }
    }
  }

  if(!todos.length){ lista.innerHTML = "Búnker vacío. Sube tu primer archivo."; return; }

  lista.innerHTML = "";
  for(const f of todos){
    const fullPath = f._prefijo === uidActual ? `${uidActual}/${f.name}` : `${uidActual}/${f._carpeta}/${f.name}`;
    const { data:signed } = await sb.storage.from(BUCKET).createSignedUrl(fullPath, 3600);
    if(!signed) continue;
    let nombreReal = f.name;
    if(nombreReal.includes("-")){
      const sinTime = nombreReal.substring(nombreReal.indexOf("-")+1);
      if(sinTime.length > 2) nombreReal = sinTime;
    }
    const isVideo = f.name.toLowerCase().match(/\.(mp4|mov|webm|m4v)$/);
    lista.innerHTML += `
      <div class="card">
        ${isVideo ? `<video src="${signed.signedUrl}" preload="metadata" controls playsinline muted></video>` : `<img src="${signed.signedUrl}" loading="lazy">`}
        <div class="name" title="${nombreReal}">${nombreReal}</div>
        <small style="color:#666">${f._carpeta}</small><br>
        <a href="${signed.signedUrl}" target="_blank"><button style="width:100%;margin-top:8px;background:#111;color:#fff;padding:8px;border-radius:8px;border:0">Ver / Descargar</button></a>
      </div>`;
  }
}

async function subir(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file) return alert("Elige un archivo");
  const ext = file.name.split('.').pop().toLowerCase();
  let sub = "documentos";
  if(['jpg','jpeg','png','webp','heic','gif'].includes(ext)) sub = "imagenes";
  if(['mp4','mov','webm','m4v','avi'].includes(ext)) sub = "videos";
  const path = `${uidActual}/${sub}/${Date.now()}-${file.name}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file);
  if(error) return alert(error.message);
  input.value = "";
  cambiarCarpeta(sub, document.querySelectorAll('.folder')[sub==='imagenes'?1:sub==='videos'?2:3]);
}

async function logout(){ await sb.auth.signOut(); location.reload(); }
</script>
</body>
</html>
